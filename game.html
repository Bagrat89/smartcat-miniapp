<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ALICE.RUN</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap');

  :root {
    --cyan: #00f0ff;
    --magenta: #ff00aa;
    --yellow: #ffee00;
    --dark: #020510;
    --dark2: #060d1f;
    --grid: rgba(0,240,255,0.07);
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--dark);
    color: var(--cyan);
    font-family: 'Share Tech Mono', monospace;
    overflow: hidden;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    touch-action: none;
    user-select: none;
  }

  /* Сетка фона */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  /* Сканлайны */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.15) 2px,
      rgba(0,0,0,0.15) 4px
    );
    pointer-events: none;
    z-index: 100;
  }

  /* ── ЭКРАН СТАРТА ── */
  #screen-start {
    position: relative;
    z-index: 10;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  .logo {
    font-family: 'Orbitron', monospace;
    font-weight: 900;
    font-size: clamp(36px, 10vw, 64px);
    color: var(--cyan);
    text-shadow:
      0 0 10px var(--cyan),
      0 0 30px var(--cyan),
      0 0 60px rgba(0,240,255,0.4);
    letter-spacing: 8px;
    animation: flicker 4s infinite;
  }

  .logo span {
    color: var(--magenta);
    text-shadow:
      0 0 10px var(--magenta),
      0 0 30px var(--magenta);
  }

  @keyframes flicker {
    0%,95%,100% { opacity: 1; }
    96% { opacity: 0.6; }
    97% { opacity: 1; }
    98% { opacity: 0.4; }
    99% { opacity: 1; }
  }

  .tagline {
    font-size: 12px;
    color: rgba(0,240,255,0.6);
    letter-spacing: 4px;
    text-transform: uppercase;
  }

  .cat-preview {
    font-size: 56px;
    animation: float 2s ease-in-out infinite;
    filter: drop-shadow(0 0 12px var(--magenta));
  }

  @keyframes float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  .btn-start {
    font-family: 'Orbitron', monospace;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 4px;
    padding: 14px 40px;
    background: transparent;
    border: 2px solid var(--cyan);
    color: var(--cyan);
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: all 0.3s;
    text-transform: uppercase;
    box-shadow: 0 0 20px rgba(0,240,255,0.3), inset 0 0 20px rgba(0,240,255,0.05);
  }

  .btn-start::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--cyan);
    transform: translateX(-100%);
    transition: transform 0.3s;
    z-index: -1;
  }

  .btn-start:hover::before, .btn-start:active::before { transform: translateX(0); }
  .btn-start:hover, .btn-start:active { color: var(--dark); }

  .controls-hint {
    font-size: 11px;
    color: rgba(0,240,255,0.4);
    letter-spacing: 2px;
  }

  /* ── ИГРА ── */
  #screen-game {
    display: none;
    position: relative;
    z-index: 10;
    width: 100%;
    height: 100dvh;
    flex-direction: column;
  }

  #hud {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 16px;
    z-index: 20;
    background: linear-gradient(180deg, rgba(2,5,16,0.9) 0%, transparent 100%);
  }

  .hud-score {
    font-family: 'Orbitron', monospace;
    font-size: clamp(14px, 4vw, 20px);
    font-weight: 700;
    color: var(--cyan);
    text-shadow: 0 0 10px var(--cyan);
  }

  .hud-coins {
    font-size: clamp(12px, 3vw, 16px);
    color: var(--yellow);
    text-shadow: 0 0 8px var(--yellow);
  }

  .hud-lives {
    font-size: clamp(14px, 4vw, 20px);
  }

  canvas {
    display: block;
    width: 100%;
    height: 100dvh;
  }

  /* ── GAME OVER ── */
  #screen-gameover {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 50;
    background: rgba(2,5,16,0.92);
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
    padding: 20px;
  }

  .go-title {
    font-family: 'Orbitron', monospace;
    font-size: clamp(28px, 8vw, 48px);
    font-weight: 900;
    color: var(--magenta);
    text-shadow: 0 0 20px var(--magenta), 0 0 40px var(--magenta);
    letter-spacing: 4px;
    animation: glitch 2s infinite;
  }

  @keyframes glitch {
    0%,90%,100% { transform: none; text-shadow: 0 0 20px var(--magenta), 0 0 40px var(--magenta); }
    91% { transform: translate(-2px,1px); text-shadow: 2px 0 var(--cyan), -2px 0 var(--yellow); }
    93% { transform: translate(2px,-1px); text-shadow: -2px 0 var(--cyan), 2px 0 var(--yellow); }
    95% { transform: none; }
  }

  .go-score {
    font-family: 'Orbitron', monospace;
    font-size: clamp(16px, 5vw, 28px);
    color: var(--cyan);
  }

  .go-best {
    font-size: 13px;
    color: rgba(0,240,255,0.6);
    letter-spacing: 2px;
  }

  .go-coins {
    font-size: 16px;
    color: var(--yellow);
    text-shadow: 0 0 8px var(--yellow);
  }

  .btn-restart {
    font-family: 'Orbitron', monospace;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 3px;
    padding: 12px 32px;
    background: transparent;
    border: 2px solid var(--magenta);
    color: var(--magenta);
    cursor: pointer;
    box-shadow: 0 0 20px rgba(255,0,170,0.3);
    transition: all 0.3s;
    text-transform: uppercase;
    margin-top: 8px;
  }

  .btn-restart:hover, .btn-restart:active {
    background: var(--magenta);
    color: var(--dark);
  }

  /* ── ТАБЛИЦА РЕКОРДОВ ── */
  #screen-leaderboard {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 50;
    background: rgba(2,5,16,0.95);
    flex-direction: column;
    align-items: center;
    padding: 20px;
    overflow-y: auto;
    gap: 12px;
  }

  .lb-title {
    font-family: 'Orbitron', monospace;
    font-size: clamp(18px, 5vw, 28px);
    font-weight: 900;
    color: var(--yellow);
    text-shadow: 0 0 15px var(--yellow);
    letter-spacing: 4px;
    margin-bottom: 8px;
  }

  .lb-table {
    width: 100%;
    max-width: 400px;
    border-collapse: collapse;
  }

  .lb-table th {
    font-size: 11px;
    letter-spacing: 3px;
    color: rgba(0,240,255,0.5);
    padding: 8px 4px;
    border-bottom: 1px solid rgba(0,240,255,0.2);
    text-align: left;
  }

  .lb-table td {
    padding: 10px 4px;
    font-size: 14px;
    border-bottom: 1px solid rgba(0,240,255,0.08);
  }

  .lb-rank { color: rgba(0,240,255,0.4); width: 30px; }
  .lb-name { color: var(--cyan); }
  .lb-score { color: var(--yellow); text-align: right; font-family: 'Orbitron', monospace; }

  .lb-rank-1 td { color: var(--yellow) !important; }
  .lb-rank-2 td { color: #c0c0c0 !important; }
  .lb-rank-3 td { color: #cd7f32 !important; }

  .lb-me { background: rgba(0,240,255,0.05); }

  .btn-close-lb {
    font-family: 'Orbitron', monospace;
    font-size: 12px;
    letter-spacing: 3px;
    padding: 10px 28px;
    background: transparent;
    border: 1px solid rgba(0,240,255,0.4);
    color: rgba(0,240,255,0.7);
    cursor: pointer;
    margin-top: 8px;
  }

  /* jump button mobile */
  #jump-btn {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: rgba(0,240,255,0.08);
    border: 2px solid rgba(0,240,255,0.3);
    color: var(--cyan);
    font-size: 28px;
    z-index: 30;
    display: none;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .glitch-line {
    position: fixed;
    left: 0; right: 0;
    height: 2px;
    background: var(--cyan);
    opacity: 0;
    z-index: 200;
    pointer-events: none;
  }
</style>
</head>
<body>

<div class="glitch-line" id="glitch-line"></div>

<!-- СТАРТ -->
<div id="screen-start">
  <div class="logo">ALICE<span>.</span>RUN</div>
  <div class="tagline">Cyber Cat // Neural Runner v2.0</div>
  <div class="cat-preview">😼</div>
  <button class="btn-start" onclick="startGame()">[ ЗАПУСТИТЬ ]</button>
  <button class="btn-start" style="border-color:var(--yellow);color:var(--yellow);box-shadow:0 0 20px rgba(255,238,0,0.2);font-size:12px;padding:10px 28px;" onclick="showLeaderboard()">[ РЕКОРДЫ ]</button>
  <div class="controls-hint">ПРОБЕЛ / ТАП — ПРЫЖОК &nbsp;|&nbsp; ДВОЙНОЙ ПРЫЖОК</div>
</div>

<!-- ИГРА -->
<div id="screen-game">
  <div id="hud">
    <div class="hud-score">⚡ <span id="score-display">0</span></div>
    <div class="hud-coins">₿ <span id="coins-display">0</span></div>
    <div class="hud-lives" id="lives-display">❤️❤️❤️</div>
  </div>
  <canvas id="gameCanvas"></canvas>
  <div id="jump-btn">▲</div>
</div>

<!-- GAME OVER -->
<div id="screen-gameover" style="display:none;">
  <div class="go-title">GAME OVER</div>
  <div class="go-score">СЧЁТ: <span id="final-score">0</span></div>
  <div class="go-coins">₿ БИТКОИНЫ: <span id="final-coins">0</span></div>
  <div class="go-best" id="best-display"></div>
  <button class="btn-restart" onclick="startGame()">[ СНОВА ]</button>
  <button class="btn-restart" style="border-color:var(--yellow);color:var(--yellow);font-size:11px;padding:8px 24px;" onclick="showLeaderboard()">[ РЕКОРДЫ ]</button>
  <button class="btn-restart" style="border-color:rgba(0,240,255,0.3);color:rgba(0,240,255,0.4);font-size:11px;padding:8px 24px;" onclick="showStart()">[ МЕНЮ ]</button>
</div>

<!-- LEADERBOARD -->
<div id="screen-leaderboard" style="display:none;">
  <div class="lb-title">⚡ РЕКОРДЫ</div>
  <table class="lb-table">
    <thead><tr>
      <th>#</th><th>ИГРОК</th><th style="text-align:right">СЧЁТ</th>
    </tr></thead>
    <tbody id="lb-body"></tbody>
  </table>
  <button class="btn-close-lb" onclick="hideLeaderboard()">[ ЗАКРЫТЬ ]</button>
</div>

<script>
// ══════════════════════════════════════════════════════
//  КОНСТАНТЫ
// ══════════════════════════════════════════════════════
const GRAVITY = 0.55;
const JUMP_FORCE = -13;
const GROUND_Y_RATIO = 0.78;
const SPEEDS = [5, 6, 7, 8, 9.5, 11];
const SPEED_THRESHOLDS = [0, 300, 700, 1200, 2000, 3000];

// ══════════════════════════════════════════════════════
//  СОСТОЯНИЕ ИГРЫ
// ══════════════════════════════════════════════════════
let canvas, ctx, W, H, groundY;
let gameRunning = false;
let animId;

let cat, obstacles, coins, particles, bgLayers;
let score, coinCount, lives, gameOver;
let frameCount, spawnTimer, coinTimer;
let speed;

// Telegram user
const tg = window.Telegram?.WebApp;
const userId = tg?.initDataUnsafe?.user?.id || 0;
const userName = tg?.initDataUnsafe?.user?.first_name || 'Аноним';

// ══════════════════════════════════════════════════════
//  ИНИЦИАЛИЗАЦИЯ CANVAS
// ══════════════════════════════════════════════════════
function initCanvas() {
  canvas = document.getElementById('gameCanvas');
  ctx = canvas.getContext('2d');
  resize();
  window.addEventListener('resize', resize);
}

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  groundY = H * GROUND_Y_RATIO;
}

// ══════════════════════════════════════════════════════
//  КОШКА
// ══════════════════════════════════════════════════════
function createCat() {
  return {
    x: W * 0.15,
    y: groundY - 50,
    vy: 0,
    w: 44,
    h: 44,
    onGround: true,
    jumps: 0,
    frame: 0,
    frameTimer: 0,
    trail: [],
    invincible: 0,
    // Анимация смерти
    dead: false,
    deadTimer: 0
  };
}

function catJump() {
  if (!gameRunning || gameOver) return;
  if (cat.jumps < 2) {
    cat.vy = cat.jumps === 0 ? JUMP_FORCE : JUMP_FORCE * 0.85;
    cat.jumps++;
    cat.onGround = false;
    spawnJumpParticles();
  }
}

function updateCat() {
  // Трейл
  cat.trail.push({ x: cat.x + cat.w/2, y: cat.y + cat.h/2 });
  if (cat.trail.length > 8) cat.trail.shift();

  cat.vy += GRAVITY;
  cat.y += cat.vy;

  if (cat.y >= groundY - cat.h) {
    cat.y = groundY - cat.h;
    cat.vy = 0;
    cat.onGround = true;
    cat.jumps = 0;
  }

  cat.frameTimer++;
  if (cat.frameTimer > 6) { cat.frame = (cat.frame+1) % 4; cat.frameTimer = 0; }
  if (cat.invincible > 0) cat.invincible--;
}

function drawCat() {
  // Трейл
  cat.trail.forEach((p, i) => {
    const a = (i / cat.trail.length) * 0.3;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.font = `${24 + i*2}px serif`;
    ctx.fillText('😼', p.x - 12, p.y + 8);
    ctx.restore();
  });

  const blink = cat.invincible > 0 && Math.floor(cat.invincible / 4) % 2 === 0;
  if (!blink) {
    ctx.save();
    // Свечение
    ctx.shadowColor = '#ff00aa';
    ctx.shadowBlur = 15;
    ctx.font = `${cat.w}px serif`;

    // Бег — смена эмодзи
    const frames = ['😼','😺','😼','🐱'];
    const emoji = cat.onGround ? frames[cat.frame] : '😸';
    ctx.fillText(emoji, cat.x, cat.y + cat.h);
    ctx.restore();
  }
}

// ══════════════════════════════════════════════════════
//  ПРЕПЯТСТВИЯ
// ══════════════════════════════════════════════════════
const OBSTACLE_TYPES = [
  { emoji: '🤖', w: 36, h: 44, ground: true,  label: 'DRONE'    },
  { emoji: '🔴', w: 28, h: 28, ground: true,  label: 'BUG'      },
  { emoji: '⚡', w: 24, h: 48, ground: true,  label: 'FIREWALL' },
  { emoji: '🛸', w: 40, h: 36, ground: false, label: 'UFO'      },
  { emoji: '💀', w: 36, h: 40, ground: true,  label: 'SKULL'    },
  { emoji: '🔒', w: 32, h: 36, ground: true,  label: 'LOCK'     },
];

function spawnObstacle() {
  const type = OBSTACLE_TYPES[Math.floor(Math.random() * OBSTACLE_TYPES.length)];
  let y;
  if (type.ground) {
    y = groundY - type.h;
  } else {
    y = groundY - type.h - (H * 0.15 + Math.random() * H * 0.1);
  }
  obstacles.push({
    x: W + 20,
    y,
    w: type.w,
    h: type.h,
    emoji: type.emoji,
    label: type.label,
    speed: speed + (Math.random() * 1.5)
  });
}

function updateObstacles() {
  for (let i = obstacles.length - 1; i >= 0; i--) {
    obstacles[i].x -= obstacles[i].speed;
    if (obstacles[i].x + obstacles[i].w < 0) obstacles.splice(i, 1);
  }
}

function drawObstacles() {
  obstacles.forEach(o => {
    ctx.save();
    ctx.shadowColor = '#ff4444';
    ctx.shadowBlur = 12;
    ctx.font = `${o.w}px serif`;
    ctx.fillText(o.emoji, o.x, o.y + o.h);
    // Лейбл
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,68,68,0.6)';
    ctx.font = '8px Share Tech Mono';
    ctx.fillText(o.label, o.x, o.y - 4);
    ctx.restore();
  });
}

// ══════════════════════════════════════════════════════
//  МОНЕТЫ (биткоины)
// ══════════════════════════════════════════════════════
function spawnCoin() {
  const yVariants = [
    groundY - 60,
    groundY - 100,
    groundY - 150,
  ];
  coins.push({
    x: W + 20,
    y: yVariants[Math.floor(Math.random() * yVariants.length)],
    w: 24, h: 24,
    collected: false,
    scale: 1,
    pulse: Math.random() * Math.PI * 2
  });
}

function updateCoins() {
  for (let i = coins.length - 1; i >= 0; i--) {
    coins[i].x -= speed * 0.9;
    coins[i].pulse += 0.1;
    coins[i].scale = 1 + Math.sin(coins[i].pulse) * 0.15;
    if (coins[i].x + coins[i].w < 0 || coins[i].collected) {
      coins.splice(i, 1);
    }
  }
}

function drawCoins() {
  coins.forEach(c => {
    ctx.save();
    ctx.shadowColor = '#ffee00';
    ctx.shadowBlur = 15;
    ctx.translate(c.x + c.w/2, c.y + c.h/2);
    ctx.scale(c.scale, c.scale);
    ctx.font = `${c.w}px serif`;
    ctx.fillText('₿', -c.w/2, c.h/2);
    ctx.restore();
  });
}

// ══════════════════════════════════════════════════════
//  ЧАСТИЦЫ
// ══════════════════════════════════════════════════════
function spawnJumpParticles() {
  for (let i = 0; i < 8; i++) {
    particles.push({
      x: cat.x + cat.w/2,
      y: cat.y + cat.h,
      vx: (Math.random() - 0.5) * 4,
      vy: Math.random() * -3,
      life: 1,
      color: Math.random() > 0.5 ? '#00f0ff' : '#ff00aa',
      size: 2 + Math.random() * 3
    });
  }
}

function spawnHitParticles() {
  for (let i = 0; i < 16; i++) {
    particles.push({
      x: cat.x + cat.w/2,
      y: cat.y + cat.h/2,
      vx: (Math.random() - 0.5) * 8,
      vy: (Math.random() - 0.5) * 8,
      life: 1,
      color: '#ff4444',
      size: 3 + Math.random() * 4
    });
  }
}

function spawnCoinParticles(x, y) {
  for (let i = 0; i < 6; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 5,
      vy: -2 - Math.random() * 3,
      life: 1,
      color: '#ffee00',
      size: 2 + Math.random() * 3
    });
  }
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.2;
    p.life -= 0.04;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawParticles() {
  particles.forEach(p => {
    ctx.save();
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 6;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });
}

// ══════════════════════════════════════════════════════
//  ФОНОВЫЕ СЛОИ (параллакс)
// ══════════════════════════════════════════════════════
function createBgLayers() {
  bgLayers = [];
  // Небоскрёбы дальние
  const buildings1 = [];
  for (let i = 0; i < 12; i++) {
    buildings1.push({
      x: Math.random() * W,
      w: 30 + Math.random() * 60,
      h: H * 0.2 + Math.random() * H * 0.25,
      color: `rgba(${Math.floor(Math.random()*30)},${Math.floor(Math.random()*30)},${40+Math.floor(Math.random()*40)},0.8)`
    });
  }
  bgLayers.push({ buildings: buildings1, speed: 0.3, offset: 0 });

  // Небоскрёбы ближние
  const buildings2 = [];
  for (let i = 0; i < 8; i++) {
    buildings2.push({
      x: Math.random() * W,
      w: 40 + Math.random() * 80,
      h: H * 0.15 + Math.random() * H * 0.2,
      color: `rgba(${Math.floor(Math.random()*20)},${Math.floor(Math.random()*40)},${60+Math.floor(Math.random()*40)},0.9)`
    });
  }
  bgLayers.push({ buildings: buildings2, speed: 0.7, offset: 0 });
}

function updateBg() {
  bgLayers.forEach(layer => {
    layer.offset = (layer.offset + layer.speed * (speed / 5)) % W;
    layer.buildings.forEach(b => {
      b.x -= layer.speed * (speed / 5);
      if (b.x + b.w < 0) {
        b.x = W + Math.random() * 100;
        b.w = 30 + Math.random() * 80;
        b.h = H * 0.15 + Math.random() * H * 0.25;
      }
    });
  });
}

function drawBg() {
  // Небо — градиент
  const sky = ctx.createLinearGradient(0, 0, 0, groundY);
  sky.addColorStop(0, '#020510');
  sky.addColorStop(0.6, '#060d1f');
  sky.addColorStop(1, '#0a1530');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, groundY);

  // Луна
  ctx.save();
  ctx.shadowColor = '#00f0ff';
  ctx.shadowBlur = 30;
  ctx.fillStyle = 'rgba(0,240,255,0.15)';
  ctx.beginPath();
  ctx.arc(W * 0.8, H * 0.12, 35, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,240,255,0.4)';
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.restore();

  // Здания
  bgLayers.forEach((layer, li) => {
    layer.buildings.forEach(b => {
      ctx.fillStyle = b.color;
      ctx.fillRect(b.x, groundY - b.h, b.w, b.h);

      // Окна
      const winColor = li === 0
        ? `rgba(0,240,255,${0.2 + Math.random() * 0.1})`
        : `rgba(255,238,0,${0.3 + Math.random() * 0.1})`;
      const rows = Math.floor(b.h / 14);
      const cols = Math.floor(b.w / 10);
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (Math.random() > 0.4) {
            ctx.fillStyle = winColor;
            ctx.fillRect(b.x + c * 10 + 2, groundY - b.h + r * 14 + 4, 5, 6);
          }
        }
      }
    });
  });

  // Неоновые горизонтальные линии (киберпанк)
  for (let i = 0; i < 3; i++) {
    const yLine = groundY * (0.5 + i * 0.15);
    const grad = ctx.createLinearGradient(0, 0, W, 0);
    grad.addColorStop(0, 'transparent');
    grad.addColorStop(0.3, i % 2 === 0 ? 'rgba(0,240,255,0.15)' : 'rgba(255,0,170,0.1)');
    grad.addColorStop(0.7, i % 2 === 0 ? 'rgba(0,240,255,0.15)' : 'rgba(255,0,170,0.1)');
    grad.addColorStop(1, 'transparent');
    ctx.strokeStyle = grad;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, yLine);
    ctx.lineTo(W, yLine);
    ctx.stroke();
  }

  // Земля
  const groundGrad = ctx.createLinearGradient(0, groundY, 0, H);
  groundGrad.addColorStop(0, '#0a1530');
  groundGrad.addColorStop(1, '#020510');
  ctx.fillStyle = groundGrad;
  ctx.fillRect(0, groundY, W, H - groundY);

  // Линия земли — неон
  ctx.save();
  ctx.shadowColor = '#00f0ff';
  ctx.shadowBlur = 8;
  ctx.strokeStyle = '#00f0ff';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, groundY);
  ctx.lineTo(W, groundY);
  ctx.stroke();
  ctx.restore();

  // Сетка на земле
  ctx.strokeStyle = 'rgba(0,240,255,0.08)';
  ctx.lineWidth = 1;
  const gridOffset = (frameCount * speed * 0.5) % 60;
  for (let x = -gridOffset; x < W; x += 60) {
    ctx.beginPath();
    ctx.moveTo(x, groundY);
    ctx.lineTo(x + (H - groundY) * 0.3, H);
    ctx.stroke();
  }
}

// ══════════════════════════════════════════════════════
//  КОЛЛИЗИИ
// ══════════════════════════════════════════════════════
function checkCollisions() {
  const margin = 8;
  const cx1 = cat.x + margin, cy1 = cat.y + margin;
  const cx2 = cat.x + cat.w - margin, cy2 = cat.y + cat.h - margin;

  // Препятствия
  if (cat.invincible <= 0) {
    for (let o of obstacles) {
      const om = 6;
      if (cx2 > o.x + om && cx1 < o.x + o.w - om &&
          cy2 > o.y + om && cy1 < o.y + o.h - om) {
        loseLife();
        return;
      }
    }
  }

  // Монеты
  for (let c of coins) {
    if (!c.collected &&
        cx2 > c.x && cx1 < c.x + c.w &&
        cy2 > c.y && cy1 < c.y + c.h) {
      c.collected = true;
      coinCount++;
      spawnCoinParticles(c.x + c.w/2, c.y + c.h/2);
      document.getElementById('coins-display').textContent = coinCount;
    }
  }
}

function loseLife() {
  lives--;
  spawnHitParticles();
  cat.invincible = 90;
  updateLivesHUD();

  if (lives <= 0) {
    endGame();
  }
}

function updateLivesHUD() {
  const hearts = ['', '❤️', '❤️❤️', '❤️❤️❤️'];
  document.getElementById('lives-display').textContent = hearts[Math.max(0, lives)] || '💀';
}

// ══════════════════════════════════════════════════════
//  СКОРОСТЬ И СЧЁТ
// ══════════════════════════════════════════════════════
function getSpeed() {
  for (let i = SPEED_THRESHOLDS.length - 1; i >= 0; i--) {
    if (score >= SPEED_THRESHOLDS[i]) return SPEEDS[i];
  }
  return SPEEDS[0];
}

// ══════════════════════════════════════════════════════
//  СПАВН
// ══════════════════════════════════════════════════════
function handleSpawns() {
  spawnTimer--;
  if (spawnTimer <= 0) {
    spawnObstacle();
    const minGap = Math.max(50, 110 - score / 30);
    spawnTimer = Math.floor(minGap + Math.random() * 60);
  }

  coinTimer--;
  if (coinTimer <= 0) {
    spawnCoin();
    coinTimer = Math.floor(80 + Math.random() * 60);
  }
}

// ══════════════════════════════════════════════════════
//  HUD
// ══════════════════════════════════════════════════════
function drawHUD() {
  // Скорость — правый угол
  ctx.save();
  ctx.fillStyle = 'rgba(0,240,255,0.3)';
  ctx.font = '9px Share Tech Mono';
  ctx.textAlign = 'right';
  ctx.fillText(`SPD:${speed.toFixed(1)}`, W - 10, H * 0.06);
  ctx.textAlign = 'left';
  ctx.restore();
}

// ══════════════════════════════════════════════════════
//  ГЛАВНЫЙ ЦИКЛ
// ══════════════════════════════════════════════════════
function gameLoop() {
  if (!gameRunning) return;
  frameCount++;
  score = Math.floor(frameCount / 6);
  speed = getSpeed();

  document.getElementById('score-display').textContent = score;

  ctx.clearRect(0, 0, W, H);

  updateBg();
  drawBg();

  handleSpawns();
  updateObstacles();
  updateCoins();
  updateCat();
  updateParticles();
  checkCollisions();

  drawObstacles();
  drawCoins();
  drawParticles();
  drawCat();
  drawHUD();

  animId = requestAnimationFrame(gameLoop);
}

// ══════════════════════════════════════════════════════
//  СТАРТ / СТОП
// ══════════════════════════════════════════════════════
function startGame() {
  hideAllScreens();
  document.getElementById('screen-game').style.display = 'flex';

  // Показать кнопку прыжка на мобильных
  const isMobile = 'ontouchstart' in window;
  if (isMobile) {
    document.getElementById('jump-btn').style.display = 'flex';
  }

  if (animId) cancelAnimationFrame(animId);
  gameRunning = false;

  cat = createCat();
  obstacles = [];
  coins = [];
  particles = [];
  score = 0;
  coinCount = 0;
  lives = 3;
  frameCount = 0;
  spawnTimer = 80;
  coinTimer = 100;
  speed = SPEEDS[0];
  gameOver = false;

  document.getElementById('score-display').textContent = '0';
  document.getElementById('coins-display').textContent = '0';
  updateLivesHUD();

  createBgLayers();
  gameRunning = true;
  gameLoop();
}

function endGame() {
  gameRunning = false;
  cancelAnimationFrame(animId);

  const best = saveScore(score);

  document.getElementById('final-score').textContent = score;
  document.getElementById('final-coins').textContent = coinCount;

  const localBest = getBestScore();
  const bestEl = document.getElementById('best-display');
  if (score >= localBest) {
    bestEl.textContent = '🏆 НОВЫЙ РЕКОРД!';
    bestEl.style.color = '#ffee00';
    bestEl.style.textShadow = '0 0 10px #ffee00';
  } else {
    bestEl.textContent = `ЛУЧШИЙ: ${localBest}`;
    bestEl.style.color = '';
    bestEl.style.textShadow = '';
  }

  document.getElementById('screen-game').style.display = 'none';
  document.getElementById('jump-btn').style.display = 'none';
  const go = document.getElementById('screen-gameover');
  go.style.display = 'flex';
}

// ══════════════════════════════════════════════════════
//  РЕКОРДЫ (localStorage)
// ══════════════════════════════════════════════════════
function getBestScore() {
  return parseInt(localStorage.getItem('alice_best') || '0');
}

function saveScore(s) {
  const best = getBestScore();
  if (s > best) {
    localStorage.setItem('alice_best', s.toString());
  }
  // Сохраняем в топ
  const lb = getLeaderboard();
  const existing = lb.findIndex(e => e.id === userId);
  if (existing >= 0) {
    if (s > lb[existing].score) lb[existing].score = s;
  } else {
    lb.push({ id: userId, name: userName, score: s });
  }
  lb.sort((a, b) => b.score - a.score);
  const top = lb.slice(0, 20);
  localStorage.setItem('alice_leaderboard', JSON.stringify(top));
  return Math.max(best, s);
}

function getLeaderboard() {
  try {
    return JSON.parse(localStorage.getItem('alice_leaderboard') || '[]');
  } catch { return []; }
}

function showLeaderboard() {
  hideAllScreens();
  const lb = getLeaderboard();
  const tbody = document.getElementById('lb-body');
  if (lb.length === 0) {
    tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;color:rgba(0,240,255,0.4);padding:20px;">Пока нет рекордов</td></tr>';
  } else {
    tbody.innerHTML = lb.map((e, i) => {
      const isMe = e.id === userId;
      const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i+1)+'.';
      return `<tr class="lb-rank-${i+1} ${isMe ? 'lb-me' : ''}">
        <td class="lb-rank">${medal}</td>
        <td class="lb-name">${isMe ? '▶ ' : ''}${e.name}</td>
        <td class="lb-score">${e.score}</td>
      </tr>`;
    }).join('');
  }
  document.getElementById('screen-leaderboard').style.display = 'flex';
}

function hideLeaderboard() {
  document.getElementById('screen-leaderboard').style.display = 'none';
  showStart();
}

// ══════════════════════════════════════════════════════
//  НАВИГАЦИЯ
// ══════════════════════════════════════════════════════
function hideAllScreens() {
  document.getElementById('screen-start').style.display = 'none';
  document.getElementById('screen-game').style.display = 'none';
  document.getElementById('screen-gameover').style.display = 'none';
  document.getElementById('screen-leaderboard').style.display = 'none';
  document.getElementById('jump-btn').style.display = 'none';
}

function showStart() {
  hideAllScreens();
  document.getElementById('screen-start').style.display = 'flex';
}

// ══════════════════════════════════════════════════════
//  УПРАВЛЕНИЕ
// ══════════════════════════════════════════════════════
document.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    e.preventDefault();
    catJump();
  }
});

document.addEventListener('touchstart', e => {
  if (gameRunning) {
    e.preventDefault();
    catJump();
  }
}, { passive: false });

document.getElementById('jump-btn').addEventListener('touchstart', e => {
  e.stopPropagation();
  catJump();
}, { passive: true });

// Случайный глитч эффект
setInterval(() => {
  const line = document.getElementById('glitch-line');
  line.style.top = Math.random() * 100 + '%';
  line.style.opacity = '0.6';
  setTimeout(() => line.style.opacity = '0', 80);
}, 3000 + Math.random() * 5000);

// ══════════════════════════════════════════════════════
//  ЗАПУСК
// ══════════════════════════════════════════════════════
window.addEventListener('load', () => {
  initCanvas();
  if (tg) { tg.ready(); tg.expand(); }
});
</script>
