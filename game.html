<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ALICE.RUN</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap');

  :root {
    --cyan: #00f0ff;
    --magenta: #ff00aa;
    --yellow: #ffee00;
    --dark: #020510;
    --dark2: #060d1f;
    --grid: rgba(0,240,255,0.07);
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--dark);
    color: var(--cyan);
    font-family: 'Share Tech Mono', monospace;
    overflow: hidden;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    touch-action: none;
    user-select: none;
  }

  /* Сетка фона */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  /* Сканлайны */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.15) 2px,
      rgba(0,0,0,0.15) 4px
    );
    pointer-events: none;
    z-index: 100;
  }

  /* ── ЭКРАН СТАРТА ── */
  #screen-start {
    position: relative;
    z-index: 10;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  .logo {
    font-family: 'Orbitron', monospace;
    font-weight: 900;
    font-size: clamp(36px, 10vw, 64px);
    color: var(--cyan);
    text-shadow:
      0 0 10px var(--cyan),
      0 0 30px var(--cyan),
      0 0 60px rgba(0,240,255,0.4);
    letter-spacing: 8px;
    animation: flicker 4s infinite;
  }

  .logo span {
    color: var(--magenta);
    text-shadow:
      0 0 10px var(--magenta),
      0 0 30px var(--magenta);
  }

  @keyframes flicker {
    0%,95%,100% { opacity: 1; }
    96% { opacity: 0.6; }
    97% { opacity: 1; }
    98% { opacity: 0.4; }
    99% { opacity: 1; }
  }

  .tagline {
    font-size: 12px;
    color: rgba(0,240,255,0.6);
    letter-spacing: 4px;
    text-transform: uppercase;
  }

  .cat-preview {
    font-size: 56px;
    animation: float 2s ease-in-out infinite;
    filter: drop-shadow(0 0 12px var(--magenta));
  }

  @keyframes float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  .btn-start {
    font-family: 'Orbitron', monospace;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 4px;
    padding: 14px 40px;
    background: transparent;
    border: 2px solid var(--cyan);
    color: var(--cyan);
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: all 0.3s;
    text-transform: uppercase;
    box-shadow: 0 0 20px rgba(0,240,255,0.3), inset 0 0 20px rgba(0,240,255,0.05);
  }

  .btn-start::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--cyan);
    transform: translateX(-100%);
    transition: transform 0.3s;
    z-index: -1;
  }

  .btn-start:hover::before, .btn-start:active::before { transform: translateX(0); }
  .btn-start:hover, .btn-start:active { color: var(--dark); }

  .controls-hint {
    font-size: 11px;
    color: rgba(0,240,255,0.4);
    letter-spacing: 2px;
  }

  .nick-input {
    background: rgba(0,240,255,0.05);
    border: 1px solid rgba(0,240,255,0.3);
    border-radius: 6px;
    color: #fff;
    font-family: 'Share Tech Mono', monospace;
    font-size: 14px;
    padding: 8px 16px;
    text-align: center;
    outline: none;
    letter-spacing: 2px;
    width: 220px;
    transition: border-color 0.2s;
  }
  .nick-input:focus { border-color: var(--cyan); box-shadow: 0 0 10px rgba(0,240,255,0.2); }
  .nick-input::placeholder { color: rgba(0,240,255,0.3); }

  /* ── ИГРА ── */
  #screen-game {
    display: none;
    position: relative;
    z-index: 10;
    width: 100%;
    height: 100dvh;
    flex-direction: column;
  }

  #hud {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 16px;
    z-index: 20;
    background: linear-gradient(180deg, rgba(2,5,16,0.9) 0%, transparent 100%);
  }

  .hud-score {
    font-family: 'Orbitron', monospace;
    font-size: clamp(14px, 4vw, 20px);
    font-weight: 700;
    color: var(--cyan);
    text-shadow: 0 0 10px var(--cyan);
  }

  .hud-coins {
    font-size: clamp(12px, 3vw, 16px);
    color: var(--yellow);
    text-shadow: 0 0 8px var(--yellow);
  }

  .hud-lives {
    font-size: clamp(14px, 4vw, 20px);
  }

  canvas {
    display: block;
    width: 100%;
    height: 100dvh;
  }

  /* ── GAME OVER ── */
  #screen-gameover {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 50;
    background: rgba(2,5,16,0.92);
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
    padding: 20px;
  }

  .go-title {
    font-family: 'Orbitron', monospace;
    font-size: clamp(28px, 8vw, 48px);
    font-weight: 900;
    color: var(--magenta);
    text-shadow: 0 0 20px var(--magenta), 0 0 40px var(--magenta);
    letter-spacing: 4px;
    animation: glitch 2s infinite;
  }

  @keyframes glitch {
    0%,90%,100% { transform: none; text-shadow: 0 0 20px var(--magenta), 0 0 40px var(--magenta); }
    91% { transform: translate(-2px,1px); text-shadow: 2px 0 var(--cyan), -2px 0 var(--yellow); }
    93% { transform: translate(2px,-1px); text-shadow: -2px 0 var(--cyan), 2px 0 var(--yellow); }
    95% { transform: none; }
  }

  .go-score {
    font-family: 'Orbitron', monospace;
    font-size: clamp(16px, 5vw, 28px);
    color: var(--cyan);
  }

  .go-best {
    font-size: 13px;
    color: rgba(0,240,255,0.6);
    letter-spacing: 2px;
  }

  .go-coins {
    font-size: 16px;
    color: var(--yellow);
    text-shadow: 0 0 8px var(--yellow);
  }

  .btn-restart {
    font-family: 'Orbitron', monospace;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 3px;
    padding: 12px 32px;
    background: transparent;
    border: 2px solid var(--magenta);
    color: var(--magenta);
    cursor: pointer;
    box-shadow: 0 0 20px rgba(255,0,170,0.3);
    transition: all 0.3s;
    text-transform: uppercase;
    margin-top: 8px;
  }

  .btn-restart:hover, .btn-restart:active {
    background: var(--magenta);
    color: var(--dark);
  }

  /* ── ТАБЛИЦА РЕКОРДОВ ── */
  #screen-leaderboard {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 50;
    background: rgba(2,5,16,0.95);
    flex-direction: column;
    align-items: center;
    padding: 20px;
    overflow-y: auto;
    gap: 12px;
  }

  .lb-title {
    font-family: 'Orbitron', monospace;
    font-size: clamp(18px, 5vw, 28px);
    font-weight: 900;
    color: var(--yellow);
    text-shadow: 0 0 15px var(--yellow);
    letter-spacing: 4px;
    margin-bottom: 8px;
  }

  .lb-table {
    width: 100%;
    max-width: 400px;
    border-collapse: collapse;
  }

  .lb-table th {
    font-size: 11px;
    letter-spacing: 3px;
    color: rgba(0,240,255,0.5);
    padding: 8px 4px;
    border-bottom: 1px solid rgba(0,240,255,0.2);
    text-align: left;
  }

  .lb-table td {
    padding: 10px 4px;
    font-size: 14px;
    border-bottom: 1px solid rgba(0,240,255,0.08);
  }

  .lb-rank { color: rgba(0,240,255,0.4); width: 30px; }
  .lb-name { color: var(--cyan); }
  .lb-score { color: var(--yellow); text-align: right; font-family: 'Orbitron', monospace; }

  .lb-rank-1 td { color: var(--yellow) !important; }
  .lb-rank-2 td { color: #c0c0c0 !important; }
  .lb-rank-3 td { color: #cd7f32 !important; }

  .lb-me { background: rgba(0,240,255,0.05); }

  .btn-close-lb {
    font-family: 'Orbitron', monospace;
    font-size: 12px;
    letter-spacing: 3px;
    padding: 10px 28px;
    background: transparent;
    border: 1px solid rgba(0,240,255,0.4);
    color: rgba(0,240,255,0.7);
    cursor: pointer;
    margin-top: 8px;
  }

  /* jump button mobile */
  #jump-btn {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: rgba(0,240,255,0.08);
    border: 2px solid rgba(0,240,255,0.3);
    color: var(--cyan);
    font-size: 28px;
    z-index: 30;
    display: none;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .glitch-line {
    position: fixed;
    left: 0; right: 0;
    height: 2px;
    background: var(--cyan);
    opacity: 0;
    z-index: 200;
    pointer-events: none;
  }
</style>
</head>
<body>

<div class="glitch-line" id="glitch-line"></div>

<!-- СТАРТ -->
<div id="screen-start">
  <div class="logo">ALICE<span>.</span>RUN</div>
  <div class="tagline">Cyber Cat // Neural Runner v2.0</div>
  <div class="cat-preview">😼</div>
  <input class="nick-input" id="nick-input" type="text" maxlength="16" placeholder="ВАШ НИК..." />
  <button class="btn-start" onclick="startGame()">[ ЗАПУСТИТЬ ]</button>
  <button class="btn-start" style="border-color:var(--yellow);color:var(--yellow);box-shadow:0 0 20px rgba(255,238,0,0.2);font-size:12px;padding:10px 28px;" onclick="showLeaderboard()">[ РЕКОРДЫ ]</button>
  <div class="controls-hint">ПРОБЕЛ / ТАП — ПРЫЖОК &nbsp;|&nbsp; ДВОЙНОЙ ПРЫЖОК</div>
</div>

<!-- ИГРА -->
<div id="screen-game">
  <div id="hud">
    <div class="hud-score">⚡ <span id="score-display">0</span></div>
    <div class="hud-coins">₿ <span id="coins-display">0</span></div>
    <div class="hud-lives" id="lives-display">❤️❤️❤️</div>
  </div>
  <canvas id="gameCanvas"></canvas>
  <div id="jump-btn">▲</div>
</div>

<!-- GAME OVER -->
<div id="screen-gameover" style="display:none;">
  <div class="go-title">GAME OVER</div>
  <div class="go-score">СЧЁТ: <span id="final-score">0</span></div>
  <div class="go-coins">₿ БИТКОИНЫ: <span id="final-coins">0</span></div>
  <div class="go-best" id="best-display"></div>
  <button class="btn-restart" onclick="startGame()">[ СНОВА ]</button>
  <button class="btn-restart" style="border-color:var(--yellow);color:var(--yellow);font-size:11px;padding:8px 24px;" onclick="showLeaderboard()">[ РЕКОРДЫ ]</button>
  <button class="btn-restart" style="border-color:rgba(0,240,255,0.3);color:rgba(0,240,255,0.4);font-size:11px;padding:8px 24px;" onclick="showStart()">[ МЕНЮ ]</button>
</div>

<!-- LEADERBOARD -->
<div id="screen-leaderboard" style="display:none;">
  <div class="lb-title">⚡ РЕКОРДЫ</div>
  <table class="lb-table">
    <thead><tr>
      <th>#</th><th>ИГРОК</th><th style="text-align:right">СЧЁТ</th>
    </tr></thead>
    <tbody id="lb-body"></tbody>
  </table>
  <button class="btn-close-lb" onclick="hideLeaderboard()">[ ЗАКРЫТЬ ]</button>
</div>

<script>
// ══════════════════════════════════════════════════════
//  ЗВУК (Web Audio API)
// ══════════════════════════════════════════════════════
let audioCtx = null;
let musicNodes = {};
let musicPlaying = false;

function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playSound(type) {
  try {
    const ac = getAudioCtx();
    if (ac.state === 'suspended') ac.resume();

    if (type === 'jump') {
      // Прыжок — быстрый восходящий свип
      const osc = ac.createOscillator();
      const gain = ac.createGain();
      osc.connect(gain); gain.connect(ac.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(300, ac.currentTime);
      osc.frequency.exponentialRampToValueAtTime(800, ac.currentTime + 0.12);
      gain.gain.setValueAtTime(0.25, ac.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.18);
      osc.start(ac.currentTime);
      osc.stop(ac.currentTime + 0.18);

    } else if (type === 'coin') {
      // Монета — два тона
      [0, 0.08].forEach((delay, i) => {
        const osc = ac.createOscillator();
        const gain = ac.createGain();
        osc.connect(gain); gain.connect(ac.destination);
        osc.type = 'triangle';
        osc.frequency.value = i === 0 ? 880 : 1320;
        gain.gain.setValueAtTime(0.2, ac.currentTime + delay);
        gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + delay + 0.15);
        osc.start(ac.currentTime + delay);
        osc.stop(ac.currentTime + delay + 0.15);
      });

    } else if (type === 'hit') {
      // Удар — шум + низкий тон
      const buf = ac.createBuffer(1, ac.sampleRate * 0.25, ac.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
      const src = ac.createBufferSource();
      src.buffer = buf;
      const filter = ac.createBiquadFilter();
      filter.type = 'lowpass'; filter.frequency.value = 400;
      const gain = ac.createGain();
      gain.gain.value = 0.35;
      src.connect(filter); filter.connect(gain); gain.connect(ac.destination);
      src.start(ac.currentTime);

      const osc = ac.createOscillator();
      const g2 = ac.createGain();
      osc.connect(g2); g2.connect(ac.destination);
      osc.type = 'sawtooth'; osc.frequency.value = 120;
      g2.gain.setValueAtTime(0.3, ac.currentTime);
      g2.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.3);
      osc.start(ac.currentTime); osc.stop(ac.currentTime + 0.3);
    }
  } catch(e) {}
}

function startMusic() {
  try {
    if (musicPlaying) return;
    const ac = getAudioCtx();
    if (ac.state === 'suspended') ac.resume();
    musicPlaying = true;

    // Синтбасс — пульсирующий ритм
    const bassLoop = () => {
      if (!musicPlaying) return;
      const notes = [55, 55, 73.4, 55, 65.4, 55, 49, 55];
      let t = ac.currentTime;
      notes.forEach((freq, i) => {
        const osc = ac.createOscillator();
        const gain = ac.createGain();
        const filter = ac.createBiquadFilter();
        filter.type = 'lowpass'; filter.frequency.value = 300;
        osc.connect(filter); filter.connect(gain); gain.connect(ac.destination);
        osc.type = 'sawtooth'; osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.12, t + i * 0.25);
        gain.gain.exponentialRampToValueAtTime(0.001, t + i * 0.25 + 0.2);
        osc.start(t + i * 0.25);
        osc.stop(t + i * 0.25 + 0.22);
      });
      musicNodes.bassTimer = setTimeout(bassLoop, notes.length * 250);
    };
    bassLoop();

    // Арпеджио — неоновая мелодия
    const arpLoop = () => {
      if (!musicPlaying) return;
      const melody = [523, 659, 784, 1047, 784, 659, 523, 440];
      let t = ac.currentTime;
      melody.forEach((freq, i) => {
        const osc = ac.createOscillator();
        const gain = ac.createGain();
        osc.connect(gain); gain.connect(ac.destination);
        osc.type = 'square'; osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.04, t + i * 0.125);
        gain.gain.exponentialRampToValueAtTime(0.001, t + i * 0.125 + 0.1);
        osc.start(t + i * 0.125);
        osc.stop(t + i * 0.125 + 0.11);
      });
      musicNodes.arpTimer = setTimeout(arpLoop, melody.length * 125);
    };
    setTimeout(arpLoop, 500);

    // Удар барабана
    const drumLoop = () => {
      if (!musicPlaying) return;
      const pattern = [1,0,0,0, 1,0,0,0, 1,0,0,0, 1,0,1,0];
      let t = ac.currentTime;
      pattern.forEach((hit, i) => {
        if (!hit) return;
        const buf = ac.createBuffer(1, ac.sampleRate * 0.05, ac.sampleRate);
        const data = buf.getChannelData(0);
        for (let j = 0; j < data.length; j++) data[j] = (Math.random()*2-1) * (1 - j/data.length);
        const src = ac.createBufferSource();
        src.buffer = buf;
        const gain = ac.createGain(); gain.gain.value = 0.18;
        src.connect(gain); gain.connect(ac.destination);
        src.start(t + i * 0.125);
      });
      musicNodes.drumTimer = setTimeout(drumLoop, pattern.length * 125);
    };
    drumLoop();

  } catch(e) {}
}

function stopMusic() {
  musicPlaying = false;
  clearTimeout(musicNodes.bassTimer);
  clearTimeout(musicNodes.arpTimer);
  clearTimeout(musicNodes.drumTimer);
}

// ══════════════════════════════════════════════════════
//  КОНСТАНТЫ
// ══════════════════════════════════════════════════════
const GRAVITY = 0.55;
const JUMP_FORCE = -13;
const GROUND_Y_RATIO = 0.78;
const SPEEDS = [5, 6, 7, 8, 9.5, 11];
const SPEED_THRESHOLDS = [0, 300, 700, 1200, 2000, 3000];

// ══════════════════════════════════════════════════════
//  СОСТОЯНИЕ ИГРЫ
// ══════════════════════════════════════════════════════
let canvas, ctx, W, H, groundY;
let gameRunning = false;
let animId;

let cat, obstacles, coins, particles, bgLayers;
let score, coinCount, lives, gameOver;
let frameCount, spawnTimer, coinTimer;
let speed;

// Telegram user
const tg = window.Telegram?.WebApp;
const userId = tg?.initDataUnsafe?.user?.id || 0;
const tgName = tg?.initDataUnsafe?.user?.first_name || '';
let userName = tgName || 'RUNNER';

// ══════════════════════════════════════════════════════
//  ИНИЦИАЛИЗАЦИЯ CANVAS
// ══════════════════════════════════════════════════════
function initCanvas() {
  canvas = document.getElementById('gameCanvas');
  ctx = canvas.getContext('2d');
  resize();
  window.addEventListener('resize', resize);
}

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  groundY = H * GROUND_Y_RATIO;
}

// ══════════════════════════════════════════════════════
//  КОШКА
// ══════════════════════════════════════════════════════
function createCat() {
  return {
    x: W * 0.15,
    y: groundY - 50,
    vy: 0,
    w: 44,
    h: 44,
    onGround: true,
    jumps: 0,
    frame: 0,
    frameTimer: 0,
    trail: [],
    invincible: 0,
    // Анимация смерти
    dead: false,
    deadTimer: 0
  };
}

function catJump() {
  if (!gameRunning || gameOver) return;
  if (cat.jumps < 2) {
    cat.vy = cat.jumps === 0 ? JUMP_FORCE : JUMP_FORCE * 0.85;
    cat.jumps++;
    cat.onGround = false;
    spawnJumpParticles();
    playSound('jump');
  }
}

function updateCat() {
  // Трейл
  cat.trail.push({ x: cat.x + cat.w/2, y: cat.y + cat.h/2 });
  if (cat.trail.length > 8) cat.trail.shift();

  cat.vy += GRAVITY;
  cat.y += cat.vy;

  if (cat.y >= groundY - cat.h) {
    cat.y = groundY - cat.h;
    cat.vy = 0;
    cat.onGround = true;
    cat.jumps = 0;
  }

  cat.frameTimer++;
  if (cat.frameTimer > 6) { cat.frame = (cat.frame+1) % 4; cat.frameTimer = 0; }
  if (cat.invincible > 0) cat.invincible--;
}

function drawPixelCat(x, y, w, frame, jumping, invincible) {
  const s = w / 10; // масштаб
  ctx.save();
  ctx.shadowColor = '#ff00aa';
  ctx.shadowBlur = 18;

  // Тело
  ctx.fillStyle = '#1a0a2e';
  ctx.beginPath();
  ctx.roundRect(x + s, y + s*3, s*8, s*6, s);
  ctx.fill();

  // Голова
  ctx.fillStyle = '#1a0a2e';
  ctx.beginPath();
  ctx.roundRect(x + s*2, y, s*6, s*5.5, s*1.5);
  ctx.fill();

  // Уши
  ctx.fillStyle = '#2a0a3e';
  // левое ухо
  ctx.beginPath();
  ctx.moveTo(x + s*2, y + s);
  ctx.lineTo(x + s*1, y - s*2);
  ctx.lineTo(x + s*3.5, y + s*0.5);
  ctx.fill();
  // правое ухо
  ctx.beginPath();
  ctx.moveTo(x + s*8, y + s);
  ctx.lineTo(x + s*9, y - s*2);
  ctx.lineTo(x + s*6.5, y + s*0.5);
  ctx.fill();

  // Внутри ушей (розовые)
  ctx.fillStyle = '#ff44aa';
  ctx.beginPath();
  ctx.moveTo(x + s*2.2, y + s*0.8);
  ctx.lineTo(x + s*1.5, y - s*1.2);
  ctx.lineTo(x + s*3.2, y + s*0.4);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(x + s*7.8, y + s*0.8);
  ctx.lineTo(x + s*8.5, y - s*1.2);
  ctx.lineTo(x + s*6.8, y + s*0.4);
  ctx.fill();

  // Неоновый контур тела
  ctx.strokeStyle = '#ff00aa';
  ctx.lineWidth = 1.5;
  ctx.shadowBlur = 8;
  ctx.beginPath();
  ctx.roundRect(x + s*2, y, s*6, s*5.5, s*1.5);
  ctx.stroke();
  ctx.beginPath();
  ctx.roundRect(x + s, y + s*3, s*8, s*6, s);
  ctx.stroke();

  // ГЛАЗА — всегда видимые
  const eyeY = y + s*2;
  const blinkEye = (frame === 1) && !jumping;
  if (blinkEye) {
    // Моргание — линия
    ctx.strokeStyle = '#00f0ff';
    ctx.lineWidth = 1.5;
    ctx.shadowColor = '#00f0ff';
    ctx.shadowBlur = 8;
    ctx.beginPath(); ctx.moveTo(x+s*3.2, eyeY+s*0.5); ctx.lineTo(x+s*4.2, eyeY+s*0.5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x+s*5.8, eyeY+s*0.5); ctx.lineTo(x+s*6.8, eyeY+s*0.5); ctx.stroke();
  } else {
    // Глаза открыты
    ctx.fillStyle = jumping ? '#ffee00' : '#00f0ff';
    ctx.shadowColor = jumping ? '#ffee00' : '#00f0ff';
    ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.ellipse(x+s*3.7, eyeY+s*0.5, s*0.9, s*(jumping?1.1:0.8), 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x+s*6.3, eyeY+s*0.5, s*0.9, s*(jumping?1.1:0.8), 0, 0, Math.PI*2); ctx.fill();
    // Зрачки
    ctx.fillStyle = '#000';
    ctx.shadowBlur = 0;
    ctx.beginPath(); ctx.arc(x+s*3.9, eyeY+s*0.6, s*0.4, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x+s*6.5, eyeY+s*0.6, s*0.4, 0, Math.PI*2); ctx.fill();
    // Блик
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(x+s*3.6, eyeY+s*0.2, s*0.2, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x+s*6.2, eyeY+s*0.2, s*0.2, 0, Math.PI*2); ctx.fill();
  }

  // Нос
  ctx.fillStyle = '#ff44aa';
  ctx.shadowColor = '#ff44aa';
  ctx.shadowBlur = 6;
  ctx.beginPath(); ctx.ellipse(x+s*5, y+s*3.6, s*0.5, s*0.35, 0, 0, Math.PI*2); ctx.fill();

  // Рот
  ctx.strokeStyle = '#ff44aa';
  ctx.lineWidth = 1;
  ctx.shadowBlur = 4;
  ctx.beginPath();
  ctx.moveTo(x+s*5, y+s*3.9);
  ctx.quadraticCurveTo(x+s*4.2, y+s*4.5, x+s*3.8, y+s*4.2);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x+s*5, y+s*3.9);
  ctx.quadraticCurveTo(x+s*5.8, y+s*4.5, x+s*6.2, y+s*4.2);
  ctx.stroke();

  // Усы
  ctx.strokeStyle = 'rgba(0,240,255,0.7)';
  ctx.lineWidth = 1;
  ctx.shadowColor = '#00f0ff';
  ctx.shadowBlur = 4;
  // левые
  ctx.beginPath(); ctx.moveTo(x+s*4.5, y+s*3.8); ctx.lineTo(x+s*1.5, y+s*3.2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x+s*4.5, y+s*4); ctx.lineTo(x+s*1.5, y+s*4.2); ctx.stroke();
  // правые
  ctx.beginPath(); ctx.moveTo(x+s*5.5, y+s*3.8); ctx.lineTo(x+s*8.5, y+s*3.2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x+s*5.5, y+s*4); ctx.lineTo(x+s*8.5, y+s*4.2); ctx.stroke();

  // Хвост
  ctx.strokeStyle = '#ff00aa';
  ctx.lineWidth = s*1.2;
  ctx.shadowColor = '#ff00aa';
  ctx.shadowBlur = 10;
  ctx.lineCap = 'round';
  const tailWag = Math.sin(frame * 1.5) * s * 2;
  ctx.beginPath();
  ctx.moveTo(x + s*9, y + s*7);
  ctx.quadraticCurveTo(x + s*12, y + s*5 + tailWag, x + s*11, y + s*3 + tailWag);
  ctx.stroke();

  // Лапки (бег)
  ctx.fillStyle = '#1a0a2e';
  ctx.strokeStyle = '#ff00aa';
  ctx.lineWidth = 1;
  ctx.shadowBlur = 6;
  const legOffset = jumping ? 0 : Math.sin(frame * 1.6) * s * 1.5;
  // передняя
  ctx.beginPath(); ctx.roundRect(x+s*2.5, y+s*7.5+legOffset, s*1.8, s*2.5, s*0.5); ctx.fill(); ctx.stroke();
  // задняя
  ctx.beginPath(); ctx.roundRect(x+s*5.5, y+s*7.5-legOffset, s*1.8, s*2.5, s*0.5); ctx.fill(); ctx.stroke();

  ctx.restore();
}

function drawCat() {
  // Трейл
  cat.trail.forEach((p, i) => {
    const a = (i / cat.trail.length) * 0.2;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.shadowColor = '#ff00aa';
    ctx.shadowBlur = 8;
    ctx.fillStyle = 'rgba(255,0,170,0.3)';
    ctx.beginPath();
    ctx.ellipse(p.x, p.y, 8 + i*2, 5 + i, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  });

  const blink = cat.invincible > 0 && Math.floor(cat.invincible / 4) % 2 === 0;
  if (!blink) {
    drawPixelCat(cat.x, cat.y, cat.w, cat.frame, !cat.onGround, cat.invincible > 0);
  }
}

// ══════════════════════════════════════════════════════
//  ПРЕПЯТСТВИЯ
// ══════════════════════════════════════════════════════
const OBSTACLE_TYPES = [
  { emoji: '🤖', w: 36, h: 44, ground: true,  label: 'DRONE'    },
  { emoji: '🔴', w: 28, h: 28, ground: true,  label: 'BUG'      },
  { emoji: '⚡', w: 24, h: 48, ground: true,  label: 'FIREWALL' },
  { emoji: '🛸', w: 40, h: 36, ground: false, label: 'UFO'      },
  { emoji: '💀', w: 36, h: 40, ground: true,  label: 'SKULL'    },
  { emoji: '🔒', w: 32, h: 36, ground: true,  label: 'LOCK'     },
];

function spawnObstacle() {
  const type = OBSTACLE_TYPES[Math.floor(Math.random() * OBSTACLE_TYPES.length)];
  let y;
  if (type.ground) {
    y = groundY - type.h;
  } else {
    y = groundY - type.h - (H * 0.15 + Math.random() * H * 0.1);
  }
  obstacles.push({
    x: W + 20,
    y,
    w: type.w,
    h: type.h,
    emoji: type.emoji,
    label: type.label,
    speed: speed + (Math.random() * 1.5)
  });
}

function updateObstacles() {
  for (let i = obstacles.length - 1; i >= 0; i--) {
    obstacles[i].x -= obstacles[i].speed;
    if (obstacles[i].x + obstacles[i].w < 0) obstacles.splice(i, 1);
  }
}

function drawObstacles() {
  obstacles.forEach(o => {
    ctx.save();
    ctx.shadowColor = '#ff4444';
    ctx.shadowBlur = 12;
    ctx.font = `${o.w}px serif`;
    ctx.fillText(o.emoji, o.x, o.y + o.h);
    // Лейбл
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,68,68,0.6)';
    ctx.font = '8px Share Tech Mono';
    ctx.fillText(o.label, o.x, o.y - 4);
    ctx.restore();
  });
}

// ══════════════════════════════════════════════════════
//  МОНЕТЫ (биткоины)
// ══════════════════════════════════════════════════════
function spawnCoin() {
  const yVariants = [
    groundY - 60,
    groundY - 100,
    groundY - 150,
  ];
  coins.push({
    x: W + 20,
    y: yVariants[Math.floor(Math.random() * yVariants.length)],
    w: 24, h: 24,
    collected: false,
    scale: 1,
    pulse: Math.random() * Math.PI * 2
  });
}

function updateCoins() {
  for (let i = coins.length - 1; i >= 0; i--) {
    coins[i].x -= speed * 0.9;
    coins[i].pulse += 0.1;
    coins[i].scale = 1 + Math.sin(coins[i].pulse) * 0.15;
    if (coins[i].x + coins[i].w < 0 || coins[i].collected) {
      coins.splice(i, 1);
    }
  }
}

function drawCoins() {
  coins.forEach(c => {
    ctx.save();
    ctx.shadowColor = '#ffee00';
    ctx.shadowBlur = 15;
    ctx.translate(c.x + c.w/2, c.y + c.h/2);
    ctx.scale(c.scale, c.scale);
    ctx.font = `${c.w}px serif`;
    ctx.fillText('₿', -c.w/2, c.h/2);
    ctx.restore();
  });
}

// ══════════════════════════════════════════════════════
//  ЧАСТИЦЫ
// ══════════════════════════════════════════════════════
function spawnJumpParticles() {
  for (let i = 0; i < 8; i++) {
    particles.push({
      x: cat.x + cat.w/2,
      y: cat.y + cat.h,
      vx: (Math.random() - 0.5) * 4,
      vy: Math.random() * -3,
      life: 1,
      color: Math.random() > 0.5 ? '#00f0ff' : '#ff00aa',
      size: 2 + Math.random() * 3
    });
  }
}

function spawnHitParticles() {
  for (let i = 0; i < 16; i++) {
    particles.push({
      x: cat.x + cat.w/2,
      y: cat.y + cat.h/2,
      vx: (Math.random() - 0.5) * 8,
      vy: (Math.random() - 0.5) * 8,
      life: 1,
      color: '#ff4444',
      size: 3 + Math.random() * 4
    });
  }
}

function spawnCoinParticles(x, y) {
  for (let i = 0; i < 6; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 5,
      vy: -2 - Math.random() * 3,
      life: 1,
      color: '#ffee00',
      size: 2 + Math.random() * 3
    });
  }
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.2;
    p.life -= 0.04;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawParticles() {
  particles.forEach(p => {
    ctx.save();
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 6;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });
}

// ══════════════════════════════════════════════════════
//  ФОНОВЫЕ СЛОИ (параллакс)
// ══════════════════════════════════════════════════════
// Неоновые цвета для зданий
const NEON_COLORS = ['#00f0ff','#ff00aa','#ffee00','#00ff88','#aa44ff'];

function createBgLayers() {
  bgLayers = [];

  // Дальние здания (маленькие, медленные)
  const buildings1 = [];
  for (let i = 0; i < 14; i++) {
    const neon = NEON_COLORS[Math.floor(Math.random() * NEON_COLORS.length)];
    buildings1.push({
      x: (W / 14) * i + Math.random() * 30,
      w: 25 + Math.random() * 45,
      h: H * 0.18 + Math.random() * H * 0.22,
      baseColor: `rgba(5,8,25,0.95)`,
      neon,
      antennaH: Math.random() > 0.5 ? 8 + Math.random() * 15 : 0,
      windowTimer: Math.random() * 100
    });
  }
  bgLayers.push({ buildings: buildings1, speed: 0.25, isFar: true });

  // Ближние здания (крупнее, быстрее)
  const buildings2 = [];
  for (let i = 0; i < 9; i++) {
    const neon = NEON_COLORS[Math.floor(Math.random() * NEON_COLORS.length)];
    buildings2.push({
      x: (W / 9) * i + Math.random() * 40,
      w: 45 + Math.random() * 75,
      h: H * 0.12 + Math.random() * H * 0.18,
      baseColor: `rgba(4,6,20,0.98)`,
      neon,
      antennaH: Math.random() > 0.4 ? 10 + Math.random() * 20 : 0,
      windowTimer: Math.random() * 100,
      hasSign: Math.random() > 0.6
    });
  }
  bgLayers.push({ buildings: buildings2, speed: 0.65, isFar: false });

  // Летающие машины
  bgLayers.flyingCars = [];
  for (let i = 0; i < 5; i++) {
    bgLayers.flyingCars.push(createFlyingCar());
  }
}

function createFlyingCar() {
  return {
    x: Math.random() * W,
    y: H * (0.08 + Math.random() * 0.35),
    speed: 0.8 + Math.random() * 2.5,
    w: 28 + Math.random() * 20,
    h: 10 + Math.random() * 6,
    color: NEON_COLORS[Math.floor(Math.random() * NEON_COLORS.length)],
    dir: Math.random() > 0.5 ? 1 : -1,
    lightPulse: Math.random() * Math.PI * 2
  };
}

function updateBg() {
  bgLayers.forEach(layer => {
    if (!layer.buildings) return;
    const spd = layer.speed * (speed / 5);
    layer.buildings.forEach(b => {
      b.x -= spd;
      b.windowTimer += 0.05;
      if (b.x + b.w < 0) {
        b.x = W + 20 + Math.random() * 80;
        b.w = layer.isFar ? (25 + Math.random() * 45) : (45 + Math.random() * 75);
        b.h = layer.isFar
          ? H * 0.18 + Math.random() * H * 0.22
          : H * 0.12 + Math.random() * H * 0.18;
        b.neon = NEON_COLORS[Math.floor(Math.random() * NEON_COLORS.length)];
        b.antennaH = Math.random() > 0.45 ? 8 + Math.random() * 20 : 0;
      }
    });
  });
  // Летающие машины
  if (bgLayers.flyingCars) {
    bgLayers.flyingCars.forEach(car => {
      car.x += car.speed * car.dir * (speed / 5);
      car.lightPulse += 0.08;
      if (car.x > W + 60) car.x = -60;
      if (car.x < -60) car.x = W + 60;
    });
  }
}

function drawNeonBuilding(b, groundY) {
  const bx = b.x, by = groundY - b.h, bw = b.w, bh = b.h;

  // Тело здания
  ctx.fillStyle = b.baseColor;
  ctx.fillRect(bx, by, bw, bh);

  // Неоновый контур
  ctx.save();
  ctx.shadowColor = b.neon;
  ctx.shadowBlur = 12;
  ctx.strokeStyle = b.neon;
  ctx.lineWidth = 1.5;
  ctx.globalAlpha = 0.7;
  ctx.strokeRect(bx, by, bw, bh);
  ctx.restore();

  // Горизонтальные неоновые полосы
  const stripes = Math.floor(bh / 35);
  for (let s = 0; s < stripes; s++) {
    const sy = by + s * 35 + 15;
    ctx.save();
    ctx.globalAlpha = 0.25;
    ctx.strokeStyle = b.neon;
    ctx.shadowColor = b.neon;
    ctx.shadowBlur = 6;
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(bx, sy); ctx.lineTo(bx + bw, sy); ctx.stroke();
    ctx.restore();
  }

  // Окна с анимацией
  const wCols = Math.floor(bw / 9);
  const wRows = Math.floor(bh / 13);
  for (let r = 0; r < wRows; r++) {
    for (let c = 0; c < wCols; c++) {
      const seed = (r * 7 + c * 13 + Math.floor(b.windowTimer + r * 0.3)) % 10;
      if (seed > 3) {
        const wx = bx + c * 9 + 2;
        const wy = by + r * 13 + 4;
        const bright = seed > 7 ? 0.9 : 0.45;
        ctx.fillStyle = seed > 7 ? b.neon : `rgba(255,238,180,${bright})`;
        ctx.shadowColor = b.neon;
        ctx.shadowBlur = seed > 7 ? 8 : 2;
        ctx.fillRect(wx, wy, 5, 7);
      }
    }
  }

  // Антенна
  if (b.antennaH > 0) {
    ctx.save();
    ctx.strokeStyle = b.neon;
    ctx.shadowColor = b.neon;
    ctx.shadowBlur = 10;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(bx + bw * 0.5, by);
    ctx.lineTo(bx + bw * 0.5, by - b.antennaH);
    ctx.stroke();
    // Мигающий огонёк
    const blink = Math.sin(b.windowTimer * 2) > 0;
    ctx.fillStyle = blink ? '#ff4444' : 'rgba(255,68,68,0.2)';
    ctx.shadowColor = '#ff4444';
    ctx.shadowBlur = blink ? 12 : 2;
    ctx.beginPath();
    ctx.arc(bx + bw * 0.5, by - b.antennaH, 2.5, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  // Рекламная вывеска
  if (b.hasSign) {
    const signs = ['AI', 'NET', 'DATA', 'SYS', 'RUN'];
    const sign = signs[Math.floor(b.x * 7 + b.h) % signs.length];
    ctx.save();
    ctx.shadowColor = b.neon;
    ctx.shadowBlur = 15;
    ctx.fillStyle = b.neon;
    ctx.font = `bold ${Math.min(bw * 0.4, 14)}px 'Share Tech Mono', monospace`;
    ctx.textAlign = 'center';
    ctx.globalAlpha = 0.8 + Math.sin(b.windowTimer * 1.5) * 0.2;
    ctx.fillText(sign, bx + bw * 0.5, by + bh * 0.25);
    ctx.restore();
  }
}

function drawFlyingCar(car) {
  const { x, y, w, h, color, dir, lightPulse } = car;
  ctx.save();
  ctx.shadowColor = color;
  ctx.shadowBlur = 14;

  // Корпус машины
  ctx.fillStyle = '#0a0a1a';
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.2;
  // Основной корпус
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, h * 0.4);
  ctx.fill();
  ctx.stroke();
  // Кабина сверху
  ctx.beginPath();
  ctx.roundRect(x + w*0.2, y - h*0.5, w*0.5, h*0.6, h*0.3);
  ctx.fill();
  ctx.stroke();

  // Двигатели — неоновые огни снизу
  const pulseA = 0.5 + Math.sin(lightPulse) * 0.5;
  ctx.globalAlpha = pulseA;
  ctx.fillStyle = color;
  ctx.shadowBlur = 20;
  ctx.beginPath(); ctx.ellipse(x + w*0.15, y + h*0.8, w*0.08, h*0.25, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x + w*0.85, y + h*0.8, w*0.08, h*0.25, 0, 0, Math.PI*2); ctx.fill();

  // Лобовые огни
  ctx.globalAlpha = 0.8;
  ctx.fillStyle = '#fff';
  ctx.shadowColor = '#fff';
  ctx.shadowBlur = 10;
  const lx = dir > 0 ? x + w - 3 : x + 1;
  ctx.beginPath(); ctx.arc(lx, y + h*0.3, 2, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(lx, y + h*0.7, 2, 0, Math.PI*2); ctx.fill();

  ctx.restore();
}

function drawBg() {
  // Небо — глубокий градиент
  const sky = ctx.createLinearGradient(0, 0, 0, groundY);
  sky.addColorStop(0, '#010208');
  sky.addColorStop(0.4, '#020510');
  sky.addColorStop(0.75, '#060d1f');
  sky.addColorStop(1, '#0a1530');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, groundY);

  // Звёзды
  ctx.save();
  for (let i = 0; i < 60; i++) {
    const sx = ((i * 137 + frameCount * 0.05) % W);
    const sy = (i * 53) % (groundY * 0.6);
    const sa = 0.3 + Math.sin(frameCount * 0.02 + i) * 0.2;
    ctx.globalAlpha = sa;
    ctx.fillStyle = '#fff';
    ctx.fillRect(sx, sy, 1, 1);
  }
  ctx.restore();

  // Луна — неоновая
  ctx.save();
  ctx.shadowColor = '#00f0ff';
  ctx.shadowBlur = 40;
  const moonGrad = ctx.createRadialGradient(W*0.82, H*0.1, 5, W*0.82, H*0.1, 38);
  moonGrad.addColorStop(0, 'rgba(0,240,255,0.25)');
  moonGrad.addColorStop(0.6, 'rgba(0,240,255,0.08)');
  moonGrad.addColorStop(1, 'transparent');
  ctx.fillStyle = moonGrad;
  ctx.beginPath(); ctx.arc(W*0.82, H*0.1, 38, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = 'rgba(0,240,255,0.5)';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(W*0.82, H*0.1, 35, 0, Math.PI*2); ctx.stroke();
  ctx.restore();

  // Дальние здания
  if (bgLayers[0]) bgLayers[0].buildings.forEach(b => drawNeonBuilding(b, groundY));

  // Летающие машины (за ближними зданиями)
  if (bgLayers.flyingCars) bgLayers.flyingCars.forEach(car => drawFlyingCar(car));

  // Ближние здания
  if (bgLayers[1]) bgLayers[1].buildings.forEach(b => drawNeonBuilding(b, groundY));

  // Неоновые горизонтальные полосы (атмосфера)
  for (let i = 0; i < 3; i++) {
    const yLine = groundY * (0.45 + i * 0.18);
    const col = i % 2 === 0 ? '0,240,255' : '255,0,170';
    const grad = ctx.createLinearGradient(0, 0, W, 0);
    grad.addColorStop(0, 'transparent');
    grad.addColorStop(0.25, `rgba(${col},0.12)`);
    grad.addColorStop(0.75, `rgba(${col},0.12)`);
    grad.addColorStop(1, 'transparent');
    ctx.strokeStyle = grad;
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, yLine); ctx.lineTo(W, yLine); ctx.stroke();
  }

  // Земля
  const groundGrad = ctx.createLinearGradient(0, groundY, 0, H);
  groundGrad.addColorStop(0, '#0a1530');
  groundGrad.addColorStop(1, '#020510');
  ctx.fillStyle = groundGrad;
  ctx.fillRect(0, groundY, W, H - groundY);

  // Линия земли — неон двойная
  ctx.save();
  ctx.shadowColor = '#00f0ff';
  ctx.shadowBlur = 15;
  ctx.strokeStyle = '#00f0ff';
  ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(W, groundY); ctx.stroke();
  ctx.strokeStyle = 'rgba(0,240,255,0.2)';
  ctx.lineWidth = 8;
  ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(W, groundY); ctx.stroke();
  ctx.restore();

  // Перспективная сетка на земле
  ctx.strokeStyle = 'rgba(0,240,255,0.07)';
  ctx.lineWidth = 1;
  const gridOffset = (frameCount * speed * 0.5) % 60;
  for (let x = -gridOffset; x < W; x += 60) {
    ctx.beginPath();
    ctx.moveTo(x, groundY);
    ctx.lineTo(x + (H - groundY) * 0.35, H);
    ctx.stroke();
  }
  for (let row = 1; row < 4; row++) {
    const gy = groundY + (H - groundY) * (row / 4);
    ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke();
  }
}

// ══════════════════════════════════════════════════════
//  КОЛЛИЗИИ
// ══════════════════════════════════════════════════════
function checkCollisions() {
  const margin = 8;
  const cx1 = cat.x + margin, cy1 = cat.y + margin;
  const cx2 = cat.x + cat.w - margin, cy2 = cat.y + cat.h - margin;

  // Препятствия
  if (cat.invincible <= 0) {
    for (let o of obstacles) {
      const om = 6;
      if (cx2 > o.x + om && cx1 < o.x + o.w - om &&
          cy2 > o.y + om && cy1 < o.y + o.h - om) {
        loseLife();
        return;
      }
    }
  }

  // Монеты
  for (let c of coins) {
    if (!c.collected &&
        cx2 > c.x && cx1 < c.x + c.w &&
        cy2 > c.y && cy1 < c.y + c.h) {
      c.collected = true;
      coinCount++;
      spawnCoinParticles(c.x + c.w/2, c.y + c.h/2);
      playSound('coin');
      document.getElementById('coins-display').textContent = coinCount;
    }
  }
}

function loseLife() {
  lives--;
  spawnHitParticles();
  playSound('hit');
  cat.invincible = 90;
  updateLivesHUD();

  if (lives <= 0) {
    endGame();
  }
}

function updateLivesHUD() {
  const hearts = ['', '❤️', '❤️❤️', '❤️❤️❤️'];
  document.getElementById('lives-display').textContent = hearts[Math.max(0, lives)] || '💀';
}

// ══════════════════════════════════════════════════════
//  СКОРОСТЬ И СЧЁТ
// ══════════════════════════════════════════════════════
function getSpeed() {
  for (let i = SPEED_THRESHOLDS.length - 1; i >= 0; i--) {
    if (score >= SPEED_THRESHOLDS[i]) return SPEEDS[i];
  }
  return SPEEDS[0];
}

// ══════════════════════════════════════════════════════
//  СПАВН
// ══════════════════════════════════════════════════════
function handleSpawns() {
  spawnTimer--;
  if (spawnTimer <= 0) {
    spawnObstacle();
    const minGap = Math.max(50, 110 - score / 30);
    spawnTimer = Math.floor(minGap + Math.random() * 60);
  }

  coinTimer--;
  if (coinTimer <= 0) {
    spawnCoin();
    coinTimer = Math.floor(80 + Math.random() * 60);
  }
}

// ══════════════════════════════════════════════════════
//  HUD
// ══════════════════════════════════════════════════════
function drawHUD() {
  // Скорость — правый угол
  ctx.save();
  ctx.fillStyle = 'rgba(0,240,255,0.3)';
  ctx.font = '9px Share Tech Mono';
  ctx.textAlign = 'right';
  ctx.fillText(`SPD:${speed.toFixed(1)}`, W - 10, H * 0.06);
  ctx.textAlign = 'left';
  ctx.restore();
}

// ══════════════════════════════════════════════════════
//  ГЛАВНЫЙ ЦИКЛ
// ══════════════════════════════════════════════════════
function gameLoop() {
  if (!gameRunning) return;
  frameCount++;
  score = Math.floor(frameCount / 6);
  speed = getSpeed();

  document.getElementById('score-display').textContent = score;

  ctx.clearRect(0, 0, W, H);

  updateBg();
  drawBg();

  handleSpawns();
  updateObstacles();
  updateCoins();
  updateCat();
  updateParticles();
  checkCollisions();

  drawObstacles();
  drawCoins();
  drawParticles();
  drawCat();
  drawHUD();

  animId = requestAnimationFrame(gameLoop);
}

// ══════════════════════════════════════════════════════
//  СТАРТ / СТОП
// ══════════════════════════════════════════════════════
function startGame() {
  // Получаем ник из поля ввода или Telegram
  const nickInput = document.getElementById('nick-input');
  const typedNick = nickInput ? nickInput.value.trim() : '';
  userName = typedNick || tgName || 'RUNNER';

  hideAllScreens();
  document.getElementById('screen-game').style.display = 'flex';

  // Показать кнопку прыжка на мобильных
  const isMobile = 'ontouchstart' in window;
  if (isMobile) {
    document.getElementById('jump-btn').style.display = 'flex';
  }

  if (animId) cancelAnimationFrame(animId);
  gameRunning = false;

  cat = createCat();
  obstacles = [];
  coins = [];
  particles = [];
  score = 0;
  coinCount = 0;
  lives = 3;
  frameCount = 0;
  spawnTimer = 80;
  coinTimer = 100;
  speed = SPEEDS[0];
  gameOver = false;

  document.getElementById('score-display').textContent = '0';
  document.getElementById('coins-display').textContent = '0';
  updateLivesHUD();

  createBgLayers();
  gameRunning = true;
  stopMusic();
  startMusic();
  gameLoop();
}

function endGame() {
  gameRunning = false;
  stopMusic();
  cancelAnimationFrame(animId);

  const best = saveScore(score);

  document.getElementById('final-score').textContent = score;
  document.getElementById('final-coins').textContent = coinCount;

  const localBest = getBestScore();
  const bestEl = document.getElementById('best-display');
  if (score >= localBest) {
    bestEl.textContent = '🏆 НОВЫЙ РЕКОРД!';
    bestEl.style.color = '#ffee00';
    bestEl.style.textShadow = '0 0 10px #ffee00';
  } else {
    bestEl.textContent = `ЛУЧШИЙ: ${localBest}`;
    bestEl.style.color = '';
    bestEl.style.textShadow = '';
  }

  document.getElementById('screen-game').style.display = 'none';
  document.getElementById('jump-btn').style.display = 'none';
  const go = document.getElementById('screen-gameover');
  go.style.display = 'flex';
}

// ══════════════════════════════════════════════════════
//  РЕКОРДЫ (localStorage)
// ══════════════════════════════════════════════════════
function getBestScore() {
  return parseInt(localStorage.getItem('alice_best') || '0');
}

function saveScore(s) {
  const best = getBestScore();
  if (s > best) {
    localStorage.setItem('alice_best', s.toString());
  }
  // Сохраняем в топ
  const lb = getLeaderboard();
  const existing = lb.findIndex(e => e.id === userId);
  if (existing >= 0) {
    if (s > lb[existing].score) lb[existing].score = s;
  } else {
    lb.push({ id: userId, name: userName, score: s });
  }
  lb.sort((a, b) => b.score - a.score);
  const top = lb.slice(0, 20);
  localStorage.setItem('alice_leaderboard', JSON.stringify(top));
  return Math.max(best, s);
}

function getLeaderboard() {
  try {
    return JSON.parse(localStorage.getItem('alice_leaderboard') || '[]');
  } catch { return []; }
}

function showLeaderboard() {
  hideAllScreens();
  const lb = getLeaderboard();
  const tbody = document.getElementById('lb-body');
  if (lb.length === 0) {
    tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;color:rgba(0,240,255,0.4);padding:20px;">Пока нет рекордов</td></tr>';
  } else {
    tbody.innerHTML = lb.map((e, i) => {
      const isMe = e.id === userId;
      const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i+1)+'.';
      return `<tr class="lb-rank-${i+1} ${isMe ? 'lb-me' : ''}">
        <td class="lb-rank">${medal}</td>
        <td class="lb-name">${isMe ? '▶ ' : ''}${e.name}</td>
        <td class="lb-score">${e.score}</td>
      </tr>`;
    }).join('');
  }
  document.getElementById('screen-leaderboard').style.display = 'flex';
}

function hideLeaderboard() {
  document.getElementById('screen-leaderboard').style.display = 'none';
  showStart();
}

// ══════════════════════════════════════════════════════
//  НАВИГАЦИЯ
// ══════════════════════════════════════════════════════
function hideAllScreens() {
  document.getElementById('screen-start').style.display = 'none';
  document.getElementById('screen-game').style.display = 'none';
  document.getElementById('screen-gameover').style.display = 'none';
  document.getElementById('screen-leaderboard').style.display = 'none';
  document.getElementById('jump-btn').style.display = 'none';
}

function showStart() {
  hideAllScreens();
  document.getElementById('screen-start').style.display = 'flex';
}

// ══════════════════════════════════════════════════════
//  УПРАВЛЕНИЕ
// ══════════════════════════════════════════════════════
document.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    e.preventDefault();
    catJump();
  }
});

document.addEventListener('touchstart', e => {
  if (gameRunning) {
    e.preventDefault();
    catJump();
  }
}, { passive: false });

document.getElementById('jump-btn').addEventListener('touchstart', e => {
  e.stopPropagation();
  catJump();
}, { passive: true });

// Случайный глитч эффект
setInterval(() => {
  const line = document.getElementById('glitch-line');
  line.style.top = Math.random() * 100 + '%';
  line.style.opacity = '0.6';
  setTimeout(() => line.style.opacity = '0', 80);
}, 3000 + Math.random() * 5000);

// ══════════════════════════════════════════════════════
//  ЗАПУСК
// ══════════════════════════════════════════════════════
window.addEventListener('load', () => {
  initCanvas();
  if (tg) { tg.ready(); tg.expand(); }
  // Предзаполняем ник из Telegram
  const nickInput = document.getElementById('nick-input');
  if (nickInput && tgName) {
    nickInput.value = tgName;
    nickInput.style.display = 'none'; // скрываем если ник уже есть
  }
});
</script>
