<script>

const tg = Telegram.WebApp;
tg.ready();
tg.expand();
tg.MainButton.hide();

let historyStack=['main'];

function showPage(pageId){
 document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
 document.getElementById(pageId).classList.add('active');
 historyStack.push(pageId);
}

function goBack(){
 if(historyStack.length>1){
  historyStack.pop();
  const prev=historyStack[historyStack.length-1];
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(prev).classList.add('active');
 }else{
  tg.close();
 }
}

document.querySelectorAll('[data-action]').forEach(btn=>{
 btn.addEventListener('click',()=>{

  const action=btn.dataset.action;

  if(action==='back'){
   goBack();
  }

  else if(action==='go-to-bot'){
   tg.close();
   setTimeout(()=>window.open('https://t.me/Alicesmartcat_bot','_blank'),200);
  }

  else if(action==='go-to-features'){
   showPage('features');
  }

  else if(action==='go-to-market'){
   showPage('market');
  }

  else if(action==='go-to-services'){
   showPage('services');
  }

  else if(action==='go-to-partners'){
   showPage('partners');
  }

  else if(action==='go-to-socials'){
   showPage('socials');
  }

  else if(action==='go-to-donate'){
   showPage('donate');
  }

  else if(action==='go-to-payment'){
   const product=btn.dataset.product;
   const title=product==='alice'?'Алиса ИИ безлимит':'Личный ИИ бот';
   document.getElementById('payment-title').textContent='Оплата: '+title;
   showPage('payment');
  }

  else if(action==='pay-crypto'){
   tg.showAlert('Крипто оплата скоро будет доступна');
  }

  else if(action==='pay-card'){
   tg.showAlert('Оплата картой скоро будет доступна');
  }

  else if(action==='pay-stars'){
   tg.showAlert('Оплата Stars скоро будет доступна');
  }

  /* =======================
     НОВЫЕ AI ФУНКЦИИ
  ======================= */

  else if(action==='special-function'){

   const fn=btn.dataset.function;
   const name=btn.innerText.trim();

   tg.sendData(JSON.stringify({
    action:"special_function",
    function:fn
   }));

   tg.showAlert("Запускаем "+name+" в боте...");
   setTimeout(()=>tg.close(),500);
  }

 });
});

document.querySelector('.lang-switch')
?.addEventListener('click',()=>{
 tg.showAlert('Переключение языка в разработке');
});

</script>
