<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Main Menu - SmartCat</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      color: #00f0ff;
      background: linear-gradient(135deg, #0d001a 0%, #1a0033 50%, #2a004d 100%);
      overflow: hidden;
      position: relative;
    }

    /* Верхняя зона с картинкой — покрывает только сверху до кнопок */
    .top-bg {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 38vh;               /* высота верхней зоны — подбери под свою картинку (30–45vh обычно идеально) */
      background: url('assets/cyber-cat.png') no-repeat center top;
      background-size: cover;     /* картинка растягивается по ширине и высоте зоны */
      background-position: center top; /* фокус на верхней части изображения */
      z-index: 1;
      pointer-events: none;       /* клики проходят сквозь картинку */
    }

    /* Тёмный градиент поверх картинки, чтобы текст и кнопки были читаемыми */
    .top-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 38vh;
      background: linear-gradient(to bottom, rgba(13,0,26,0.75) 0%, rgba(13,0,26,0.95) 70%, transparent 100%);
      z-index: 2;
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 3;                 /* весь контент поверх фона и оверлея */
      padding: 16px 12px;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Переключатель языка */
    .lang-switch {
      position: absolute;
      top: 10px;
      right: 12px;
      font-size: 10px;
      color: #88ffff;
      opacity: 0.6;
      user-select: none;
      cursor: default;
      z-index: 4;
    }

    .title {
      text-align: center;
      font-size: 24px;
      margin: 20px 0 24px;
      text-shadow: 0 0 15px #00f0ff, 0 0 30px #ff00aa;
      letter-spacing: 1.5px;
      z-index: 4;
    }

    .buttons-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      flex: 1;
      align-content: center;
    }

    .btn {
      background: rgba(26, 13, 46, 0.65);
      border: 1px solid #00f0ff22;
      border-radius: 12px;
      padding: 14px 10px;
      color: #00f0ff;
      font-size: 14px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.12);
      backdrop-filter: blur(5px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .btn:hover,
    .btn:active {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.4);
      border-color: #ff00aa66;
    }

    .btn .emoji {
      font-size: 26px;
      margin-bottom: 2px;
    }

    .btn .subtitle {
      font-size: 10px;
      opacity: 0.65;
      color: #88ffff;
      line-height: 1.1;
    }

    @media (max-height: 600px) {
      .title { font-size: 20px; margin: 16px 0 20px; }
      .btn { padding: 12px 8px; font-size: 13px; }
      .btn .emoji { font-size: 22px; }
      .btn .subtitle { font-size: 9px; }
      .top-bg, .top-overlay { height: 32vh; } /* уменьшаем верхнюю зону на маленьких экранах */
    }
  </style>
</head>
<body>

  <div class="lang-switch">ENG / RU</div>

  <!-- Верхняя зона с картинкой -->
  <div class="top-bg"></div>
  <div class="top-overlay"></div>

  <div class="container">
    <div class="title">Main Menu</div>

    <div class="buttons-grid">
      <div class="btn" onclick="alert('В разработке — Алиса Smartcat A.I.')">
        <span class="emoji">💬</span>
        Алиса Smartcat A.I.
        <span class="subtitle">Текстовый чат</span>
      </div>

      <div class="btn" onclick="alert('В разработке — Возможности ИИ')">
        <span class="emoji">⚙️</span>
        Возможности ИИ
        <span class="subtitle">Генерация, скачивание...</span>
      </div>

      <div class="btn" onclick="alert('В разработке — Наши соцсети')">
        <span class="emoji">🌐</span>
        Наши соцсети
        <span class="subtitle">Telegram, TikTok и др.</span>
      </div>

      <div class="btn" onclick="alert('В разработке — Наши партнёры')">
        <span class="emoji">🤝</span>
        Наши партнёры
        <span class="subtitle">Надёжные проекты</span>
      </div>

      <div class="btn" onclick="alert('В разработке — Игра')">
        <span class="emoji">🎮</span>
        Игра
        <span class="subtitle">Поиграй с Алисой</span>
      </div>

      <div class="btn" onclick="alert('В разработке — ИИ боты на заказ')">
        <span class="emoji">🤖</span>
        ИИ боты на заказ
        <span class="subtitle">Создадим твоего</span>
      </div>

      <div class="btn" onclick="alert('В разработке — ИИ стикеры')">
        <span class="emoji">🖼️</span>
        ИИ стикеры
        <span class="subtitle">Наши крутые стикеры</span>
      </div>

      <div class="btn" onclick="alert('В разработке — На Кибервискас')">
        <span class="emoji">💰</span>
        На Кибервискас
        <span class="subtitle">Поддержать проект</span>
      </div>
    </div>
  </div>

  <script>
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
    Telegram.WebApp.MainButton.hide();

    document.querySelector('.lang-switch').addEventListener('click', () => {
      alert('Переключение языка в разработке');
    });
  </script>
</body>
</html>
