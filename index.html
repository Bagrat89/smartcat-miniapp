<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Smartcat Miniapp</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

*{margin:0;padding:0;box-sizing:border-box;}

body{
background:#000;
color:#fff;
font-family:sans-serif;
height:100dvh;
overflow:hidden;
}

.container{
height:100dvh;
display:flex;
flex-direction:column;
gap:8px;
padding:8px;
}

.page{display:none;}
.page.active{display:block;}

.title{
text-align:center;
font-size:20px;
margin-bottom:10px;
color:#00f0ff;
}

.buttons-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
}

.btn{
background:rgba(255,255,255,.06);
border-radius:14px;
padding:14px;
text-align:center;
cursor:pointer;
transition:.25s;
border:1px solid rgba(0,255,255,.2);
}

.btn:hover{
transform:translateY(-3px);
background:rgba(0,255,255,.15);
}

.btn-content{
display:flex;
flex-direction:column;
align-items:center;
}

.btn-label{color:#00f0ff;font-size:14px;}

/* ===== SPECIAL FUNCTIONS ===== */

.special-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin-top:10px;
}

.special-btn{
backdrop-filter:blur(12px);
background:rgba(255,255,255,.06);
border:1px solid rgba(0,255,255,.25);
border-radius:14px;
padding:12px 6px;
text-align:center;
cursor:pointer;
transition:.25s;
}

.special-btn:hover{
transform:translateY(-3px) scale(1.03);
background:rgba(0,255,255,.12);
box-shadow:0 0 12px rgba(0,255,255,.35);
}

.special-emoji{
font-size:28px;
display:block;
margin-bottom:6px;
}

.special-label{
font-size:12px;
color:#00f0ff;
}

</style>
</head>

<body>

<div class="container">

<!-- MAIN -->
<div id="main" class="page active">

<div class="title">🐱 Smartcat</div>

<div class="buttons-grid">

<div class="btn" data-action="go-to-features">
<div class="btn-content">
<span>✨</span>
<span class="btn-label">Особые функции</span>
</div>
</div>

<div class="btn" data-action="go-to-bot">
<div class="btn-content">
<span>🤖</span>
<span class="btn-label">Открыть бота</span>
</div>
</div>

</div>
</div>


<!-- FEATURES -->
<div id="features" class="page">

<div class="title">Особые функции</div>

<div class="special-grid">

<div class="special-btn" data-action="special_function" data-function="image">
<span class="special-emoji">🎨</span>
<div class="special-label">Генерация картинки</div>
</div>

<div class="special-btn" data-action="special_function" data-function="photo-edit">
<span class="special-emoji">✂️📸</span>
<div class="special-label">Редактор фото</div>
</div>

<div class="special-btn" data-action="special_function" data-function="ocr">
<span class="special-emoji">🔍📄</span>
<div class="special-label">Анализ фото / OCR</div>
</div>

<div class="special-btn" data-action="special_function" data-function="video">
<span class="special-emoji">⬇️🎥</span>
<div class="special-label">Скачать видео</div>
</div>

<div class="special-btn" data-action="special_function" data-function="crypto">
<span class="special-emoji">₿💱</span>
<div class="special-label">Курс криптовалют</div>
</div>

<div class="special-btn" data-action="special_function" data-function="smarthome">
<span class="special-emoji">🏠🔌</span>
<div class="special-label">Умный дом</div>
</div>

<div class="special-btn" data-action="special_function" data-function="planner">
<span class="special-emoji">📅🔔</span>
<div class="special-label">Ежедневник</div>
</div>

<div class="special-btn" data-action="special_function" data-function="qr">
<span class="special-emoji">🔲</span>
<div class="special-label">QR код</div>
</div>

<div class="special-btn" data-action="special_function" data-function="translate">
<span class="special-emoji">🌐</span>
<div class="special-label">Переводчик</div>
</div>

<div class="special-btn" data-action="special_function" data-function="convert">
<span class="special-emoji">📁↔️</span>
<div class="special-label">Конвертер файлов</div>
</div>

<div class="special-btn" data-action="special_function" data-function="summary">
<span class="special-emoji">📝✂️</span>
<div class="special-label">Суммаризация статьи</div>
</div>

</div>

<br>

<div class="btn" data-action="back">
<div class="btn-content">
<span>←</span>
<span class="btn-label">Назад</span>
</div>
</div>

</div>

</div>


<script>

const tg = Telegram.WebApp;
tg.ready();
tg.expand();

let historyStack=['main'];

function showPage(id){
document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
document.getElementById(id).classList.add('active');
historyStack.push(id);
}

function goBack(){
if(historyStack.length>1){
historyStack.pop();
const prev=historyStack[historyStack.length-1];
document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
document.getElementById(prev).classList.add('active');
}else{
tg.close();
}
}

document.querySelectorAll('[data-action]').forEach(btn=>{
btn.addEventListener('click',()=>{

const action=btn.dataset.action;

if(action==='go-to-features'){
showPage('features');
}

else if(action==='go-to-bot'){
tg.close();
setTimeout(()=>window.open('https://t.me/Alicesmartcat_bot','_blank'),200);
}

else if(action==='back'){
goBack();
}

else if(action==='special_function'){

const func=btn.dataset.function;

tg.sendData(JSON.stringify({
action:"special_function",
function:func
}));

tg.showAlert("Запускаем функцию в боте...");
setTimeout(()=>tg.close(),700);

}

});
});

</script>

</body>
</html>
