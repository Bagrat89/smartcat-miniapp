<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Smartcat Miniapp</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Orbitron:wght@700;900&family=Exo+2:wght@400;600;700&display=swap" rel="stylesheet"/>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      font-family: 'Exo 2', sans-serif;
      height: 100dvh;
      overflow: hidden;
      background: #000;
      color: #fff;
    }

    .container {
      height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 0px 6px 6px 6px;
      gap: 4px;
    }

    /* ── BANNER ── */
    .banner {
      position: relative;
      width: 100%;
      flex: 0 0 15%;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
    }

    .banner-bg {
      position: absolute;
      inset: 0;
      background-image: url('data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEASABIAAD/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wgARCAGcAt8DASIAAhEBAxEB/8QAHAAAAgMBAQEBAAAAAAAAAAAAAwQBAgUGAAcI/8QAGgEAAwEBAQEAAAAAAAAAAAAAAAECAwQFBv/aAAwDAQACEAMQAAAB5YZBZ+uNa4tee0gYcUki4i1irDQK4mtzn9/XkPMToeifBStoEGpgqF2K3VDUOJp0IjJxcFKG5D4GigKmX1ZD0T5qsWhkTNmq2m46UMNv3plqTxtDx69JkxWfU1LgcX8n7P081Vm6+Q6urpdHh9PPsAqm1WWupM6tLQztR56+7zXS7Y6Rs3Q4mBHVxtOjXFnIVo1g6GZ29wqaIMdDcps5fnSuvqAOJJgFzmCUcHKQixnI/TcyiPRx+2oNsOnOtqZh6x3cMdXJa0sXMUs0TaxNfXHRisXFA1FJYZbrMDebYtltZg10sDVzjMZ12KzihaaQdM66ZzALNHsK7LzHmTFpai8yE1JA6ReApapKTnRZGyQ1g9fy+OuHQw95pPpl1zdHOV5raTMdCZfTFKa+LtaJimhn30r6Wbt6YN/SPmxNMu...(truncated)...'); /* твой base64 остаётся */
      background-size: cover;
      background-position: center;
    }

    /* ── ТВОИ СТАРЫЕ СТИЛИ ДЛЯ КНОПОК И СТРАНИЦ ── */
    /* ... оставляем всё как было ... */

    /* НОВЫЕ СТИЛИ ТОЛЬКО ДЛЯ ОСОБЫХ ФУНКЦИЙ */
    .special-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
      padding: 12px 6px;
    }

    .special-btn {
      background: rgba(0, 240, 255, 0.12);
      border: 1px solid rgba(0, 240, 255, 0.3);
      border-radius: 12px;
      padding: 16px 8px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .special-btn:hover {
      background: rgba(0, 240, 255, 0.25);
      transform: scale(1.03);
    }

    .special-btn .emoji {
      font-size: 32px;
      display: block;
      margin-bottom: 6px;
    }

    .special-btn .label {
      font-size: 14px;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- ТВОЙ ОРИГИНАЛЬНЫЙ БАННЕР И ГЛАВНАЯ СТРАНИЦА (не трогаем) -->
    <div class="banner">
      <div class="banner-bg"></div>
      <!-- ... твой старый код баннера ... -->
    </div>

    <!-- ... другие блоки главной страницы, которые были в оригинале ... -->

    <!-- ОБНОВЛЁННЫЙ БЛОК ОСОБЫХ ФУНКЦИЙ -->
    <div id="features" class="page">
      <div class="title">🛠️ Особые функции</div>
      <div class="special-grid">

        <div class="special-btn" data-action="special-image">
          <span class="emoji">🎨</span>
          <span class="label">Генерация картинки</span>
        </div>

        <div class="special-btn" data-action="special-photo-edit">
          <span class="emoji">✂️📸</span>
          <span class="label">Редактор фото</span>
        </div>

        <div class="special-btn" data-action="special-ocr">
          <span class="emoji">🔍📄</span>
          <span class="label">Анализ фото / OCR</span>
        </div>

        <div class="special-btn" data-action="special-download">
          <span class="emoji">⬇️🎥</span>
          <span class="label">Скачать видео</span>
        </div>

        <div class="special-btn" data-action="special-crypto">
          <span class="emoji">₿💱</span>
          <span class="label">Курс крипты + конвертер</span>
        </div>

        <div class="special-btn" data-action="special-smarthome">
          <span class="emoji">🏠🔌</span>
          <span class="label">Умный дом</span>
        </div>

        <div class="special-btn" data-action="special-reminder">
          <span class="emoji">📅🔔</span>
          <span class="label">Напоминания</span>
        </div>

        <div class="special-btn" data-action="special-qr">
          <span class="emoji">🔲</span>
          <span class="label">Генерация QR</span>
        </div>

        <div class="special-btn" data-action="special-translate">
          <span class="emoji">🌐</span>
          <span class="label">Переводчик</span>
        </div>

        <div class="special-btn" data-action="special-convert">
          <span class="emoji">📁↔️</span>
          <span class="label">Конвертер файлов</span>
        </div>

        <div class="special-btn" data-action="special-summary">
          <span class="emoji">📝✂️</span>
          <span class="label">Суммаризация статьи</span>
        </div>

        <div class="btn" data-action="back">
          <div class="btn-content">
            <span style="font-size:22px;margin-bottom:3px;">←</span>
            <span class="btn-label" style="color:#00f0ff;">Назад</span>
          </div>
        </div>
      </div>
    </div>

    <!-- остальные твои страницы (market, services, payment и т.д.) остаются без изменений -->
    <!-- ... -->

  </div>

  <script>
    const tg = Telegram.WebApp;
    tg.ready();
    tg.expand();
    tg.MainButton.hide();

    let historyStack = ['main'];

    function showPage(pageId) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById(pageId).classList.add('active');
      historyStack.push(pageId);
    }

    function goBack() {
      if (historyStack.length > 1) {
        historyStack.pop();
        const prev = historyStack[historyStack.length - 1];
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(prev).classList.add('active');
      } else {
        tg.close();
      }
    }

    // ── ПРИНУДИТЕЛЬНО ПОКАЗЫВАЕМ ГЛАВНУЮ СТРАНИЦУ ПРИ ЗАПУСКЕ ──
    window.addEventListener('load', () => {
      tg.ready();
      tg.expand();

      // скрываем все .page
      document.querySelectorAll('.page').forEach(p => {
        p.style.display = 'none';
      });

      // показываем главную (баннер или первый видимый блок)
      const mainContent = document.querySelector('.banner') || document.querySelector('.container > div:first-child');
      if (mainContent) {
        mainContent.style.display = 'block';
      }

      // если у тебя есть своя функция showPage — вызываем главную
      if (typeof showPage === 'function') {
        showPage('main');  // если главная не #main — замени на правильный id
      }
    });

    // ── ОБРАБОТЧИК КНОПОК ── (твой старый код + новые кнопки)
    document.querySelectorAll('[data-action]').forEach(btn => {
      btn.addEventListener('click', () => {
        const action = btn.dataset.action;

        if (action === 'back') {
          goBack();

        } else if (action.startsWith('special-')) {
          const func = action.replace('special-', '');

          tg.sendData(JSON.stringify({
            action: 'special_function',
            function: func
          }));

          tg.showAlert(`Запускаем ${func} в боте...`);
          tg.close();

        } else if (action === 'go-to-features') {
          showPage('features');

        } else if (action === 'go-to-apk') {
          tg.openTelegramLink('https://t.me/smartapp_apk');

        } else if (action === 'go-to-game') {
          // заглушка
        } else if (action === 'go-to-market') {
          showPage('market');

        } else if (action === 'go-to-stickers') {
          tg.openTelegramLink('https://t.me/addstickers/AliceSmartCat');

        } else if (action === 'go-to-socials') {
          showPage('socials');

        } else if (action === 'go-to-donate') {
          showPage('donate');

        } else if (action === 'go-to-services') {
          showPage('services');

        } else if (action === 'go-to-partners') {
          showPage('partners');

        } else if (action === 'go-to-payment') {
          const product = btn.dataset.product;
          const title = product === 'alice' ? 'Алиса ИИ безлимит' : 'Личный ИИ бот';
          document.getElementById('payment-title').textContent = 'Оплата: ' + title;
          showPage('payment');

        } else if (action === 'pay-crypto') {
          tg.showAlert('Крипто оплата — скоро будет доступна! Напиши нам в поддержку.');

        } else if (action === 'pay-card') {
          tg.showAlert('Оплата картой — скоро будет доступна! Напиши нам в поддержку.');

        } else if (action === 'pay-stars') {
          tg.showAlert('Оплата Telegram Stars — скоро будет доступна!');
        }
      });
    });

    // Переключение языка (заглушка)
    document.querySelector('.lang-switch').addEventListener('click', () => {
      tg.showAlert('Переключение языка в разработке');
    });
  </script>
</body>
</html>
