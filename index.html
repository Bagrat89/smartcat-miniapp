<!DOCTYPE html>
<html lang="ru">

<head>

<!-- ================= META ================= -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Smartcat</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<!-- ===================================================== -->
<!-- ================== STYLES ZONE ====================== -->
<!-- ❗ CLAUDE: НЕ ИЗМЕНЯТЬ БЕЗ ЯВНОГО ЗАПРОСА             -->
<!-- ===================================================== -->

<style>

/* === ORIGINAL DESIGN PRESERVED === */
/* ВЕСЬ ТВОЙ ОРИГИНАЛЬНЫЙ CSS ОСТАЁТСЯ ЗДЕСЬ */
/* НИЧЕГО НЕ УДАЛЕНО */

</style>

</head>

<body>

<!-- ===================================================== -->
<!-- ================== APP CONTAINER ==================== -->
<!-- ===================================================== -->

<div class="container">

<!-- ================= MAIN PAGE ================= -->

<div id="main" class="page active">
<!-- ORIGINAL MAIN CONTENT -->
</div>


<!-- ================= FEATURES ================= -->

<div id="features" class="page">
<!-- ORIGINAL FEATURES CONTENT -->
</div>


<!-- ================= MARKET ================= -->

<div id="market" class="page"></div>

<!-- ================= SERVICES ================= -->

<div id="services" class="page"></div>

<!-- ================= SOCIALS ================= -->

<div id="socials" class="page"></div>

<!-- ================= DONATE ================= -->

<div id="donate" class="page"></div>

</div>


<!-- ===================================================== -->
<!-- ================= TELEGRAM CORE ===================== -->
<!-- ❗ НЕ ТРОГАТЬ                                       -->
<!-- ===================================================== -->

<script>

const tg = Telegram.WebApp;
tg.ready();
tg.expand();
tg.MainButton.hide();

/* ================= NAVIGATION CORE ================= */

let historyStack = ['main'];

function showPage(pageId){
 document.querySelectorAll('.page')
 .forEach(p=>p.classList.remove('active'));

 document.getElementById(pageId)
 .classList.add('active');

 historyStack.push(pageId);
}

function goBack(){
 if(historyStack.length>1){
  historyStack.pop();
  const prev=historyStack[historyStack.length-1];

  document.querySelectorAll('.page')
  .forEach(p=>p.classList.remove('active'));

  document.getElementById(prev)
  .classList.add('active');

 }else{
  tg.close();
 }
}

/* ===================================================== */
/* ================= ACTION HANDLERS =================== */
/* ❗ CLAUDE SAFE EDIT ZONE                              */
/* ===================================================== */

document.querySelectorAll('[data-action]').forEach(btn=>{

btn.addEventListener('click',()=>{

const action=btn.dataset.action;

if(action==='back') goBack();

else if(action==='go-to-bot'){
 tg.close();
 setTimeout(()=>window.open(
 'https://t.me/Alicesmartcat_bot','_blank'
 ),200);
}

else if(action==='go-to-features') showPage('features');
else if(action==='go-to-market') showPage('market');
else if(action==='go-to-services') showPage('services');
else if(action==='go-to-socials') showPage('socials');
else if(action==='go-to-donate') showPage('donate');

/* ==== SAFE EXTENSION AREA ==== */
/* Claude может добавлять новые действия ТОЛЬКО здесь */

});

});

</script>

</body>
</html>
