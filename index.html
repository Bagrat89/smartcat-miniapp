<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Smartcat Miniapp</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Orbitron:wght@700;900&family=Exo+2:wght@400;600;700&display=swap" rel="stylesheet"/>
  
  <style>
    /* ── ВСЕ ТВОИ СТАРЫЕ СТИЛИ ── (оставляем как есть) */
    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      font-family: 'Exo 2', sans-serif;
      height: 100dvh;
      overflow: hidden;
      background: #000;
      color: #fff;
    }

    .container {
      height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 0px 6px 6px 6px;
      gap: 4px;
    }

    /* ... ВСТАВЬ СЮДА ВСЕ СВОИ ОСТАЛЬНЫЕ СТАРЫЕ СТИЛИ ... */
    /* (баннер, кнопки, страницы и т.д.) */

    /* ── Новые стили ТОЛЬКО для Особых функций ── */
    .special-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
      padding: 12px 6px;
    }

    .special-btn {
      background: rgba(0, 240, 255, 0.10);
      border: 1px solid rgba(0, 240, 255, 0.25);
      border-radius: 12px;
      padding: 14px 8px;
      text-align: center;
      cursor: pointer;
      transition: all 0.18s ease;
      backdrop-filter: blur(4px);
    }

    .special-btn:hover {
      background: rgba(0, 240, 255, 0.22);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(0, 240, 255, 0.15);
    }

    .special-btn .emoji {
      font-size: 32px;
      display: block;
      margin-bottom: 6px;
    }

    .special-btn .label {
      font-size: 13px;
      font-weight: 500;
      line-height: 1.2;
    }

    .back-btn {
      background: rgba(255, 255, 255, 0.08) !important;
      border-color: rgba(255, 255, 255, 0.2) !important;
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- ── ТВОЯ ЗАГЛАВНАЯ СТРАНИЦА / БАННЕР / МЕНЮ ── -->
    <!-- ОСТАВЛЯЕМ ВСЁ КАК БЫЛО, НЕ ТРОГАЕМ -->
    <!-- ... твой старый код главной страницы, баннера, кнопок с картинками и т.д. ... -->

    <!-- ── Блок Особые функции (обновлённый) ── -->
    <div id="features" class="page" style="display:none;">  <!-- display:none — чтобы не открывался первым -->

      <div class="title">🛠️ Особые функции</div>

      <div class="special-grid">

        <div class="special-btn" data-action="special-image">
          <span class="emoji">🎨</span>
          <span class="label">Генерация картинки</span>
        </div>

        <div class="special-btn" data-action="special-photo-edit">
          <span class="emoji">✂️📸</span>
          <span class="label">Редактор фото</span>
        </div>

        <div class="special-btn" data-action="special-ocr">
          <span class="emoji">🔍📄</span>
          <span class="label">Анализ фото / OCR</span>
        </div>

        <div class="special-btn" data-action="special-download">
          <span class="emoji">⬇️🎥</span>
          <span class="label">Скачать видео</span>
        </div>

        <div class="special-btn" data-action="special-crypto">
          <span class="emoji">₿💱</span>
          <span class="label">Курс крипты + конвертер</span>
        </div>

        <div class="special-btn" data-action="special-smarthome">
          <span class="emoji">🏠🔌</span>
          <span class="label">Умный дом</span>
        </div>

        <div class="special-btn" data-action="special-reminder">
          <span class="emoji">📅🔔</span>
          <span class="label">Напоминания</span>
        </div>

        <div class="special-btn" data-action="special-qr">
          <span class="emoji">🔲</span>
          <span class="label">Генерация QR</span>
        </div>

        <div class="special-btn" data-action="special-translate">
          <span class="emoji">🌐</span>
          <span class="label">Переводчик</span>
        </div>

        <div class="special-btn" data-action="special-convert">
          <span class="emoji">📁↔️</span>
          <span class="label">Конвертер файлов</span>
        </div>

        <div class="special-btn" data-action="special-summary">
          <span class="emoji">📝✂️</span>
          <span class="label">Суммаризация статьи</span>
        </div>

        <!-- Кнопка назад (адаптируй под свой стиль, если нужно) -->
        <div class="btn back-btn" data-action="back">
          <span class="emoji">←</span>
          <span class="label">Назад</span>
        </div>

      </div>
    </div>

    <!-- ── ОСТАЛЬНЫЕ ТВОИ СТРАНИЦЫ (market, socials, donate и т.д.) ── -->
    <!-- ... оставляем без изменений ... -->

  </div>

  <script>
    // ── ИНИЦИАЛИЗАЦИЯ TELEGRAM WEB APP ──
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // ── ПРИНУДИТЕЛЬНО ПОКАЗЫВАЕМ ГЛАВНУЮ СТРАНИЦУ ПРИ ЗАПУСКЕ ──
    window.addEventListener('DOMContentLoaded', () => {
      // Показываем container
      document.querySelector('.container').style.display = 'flex';

      // Если у тебя есть функция showPage — вызываем главную
      if (typeof showPage === 'function') {
        showPage('main');  // замени 'main' на реальное имя твоей главной страницы (home, start, banner и т.д.)
      } else {
        // Если страниц нет — показываем первый видимый блок
        const firstVisible = document.querySelector('.container > div:not([style*="display:none"])');
        if (firstVisible) firstVisible.style.display = 'block';
      }

      console.log('Mini App запущен');
    });

    // ── ТВОЙ СТАРЫЙ ОБРАБОТЧИК КНОПОК ── (оставляем как есть)
    // ... весь твой существующий код с btn.addEventListener ...

    // Добавляем обработку новых кнопок Особых функций
    document.querySelectorAll('.special-btn, .back-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const action = btn.dataset.action;

        if (action === 'back') {
          // твоя функция назад (если есть)
          goBack ? goBack() : tg.close();
        } else if (action.startsWith('special-')) {
          const func = action.replace('special-', '');

          // Фронтовые функции (пока заглушки)
          if (['qr', 'translate', 'crypto'].includes(func)) {
            tg.showAlert(`Открываем ${func}... (в разработке)`);
          } else {
            // Остальные — отправляем в бота
            tg.sendData(JSON.stringify({
              action: 'special_function',
              function: func
            }));

            tg.showAlert(`Запускаем ${func} в боте...`);
            tg.close();  // бот сразу ответит
          }
        }
      });
    });
  </script>
</body>
</html>
