<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Smartcat Miniapp</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Orbitron:wght@700;900&family=Exo+2:wght@400;600;700&display=swap" rel="stylesheet"/>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      font-family: 'Exo 2', sans-serif;
      height: 100dvh;
      overflow: hidden;
      background: #000;
      color: #fff;
    }

    .container {
      height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 0px 6px 6px 6px;
      gap: 4px;
    }

    /* ── BANNER ── */
    .banner {
      position: relative;
      width: 100%;
      flex: 0 0 15%;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
    }

    .banner-bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- Здесь был твой баннер и остальной контент, я оставил его без изменений -->

    <!-- Особые функции (без Автоматического заработка) -->
    <div id="special-features" class="page">
      <div class="title">Особые функции</div>
      <div class="buttons-grid">

        <div class="btn" data-action="feature-img-gen">
          <div class="btn-content">
            <span style="font-size:22px;margin-bottom:3px;">🎨</span>
            <span class="btn-label" style="color:#00f0ff;">Генерация фото по тексту</span>
          </div>
        </div>

        <div class="btn" data-action="feature-photo-editor">
          <div class="btn-content">
            <span style="font-size:22px;margin-bottom:3px;">✂️</span>
            <span class="btn-label" style="color:#00f0ff;">Редактор фото</span>
          </div>
        </div>

        <div class="btn" data-action="feature-ocr">
          <div class="btn-content">
            <span style="font-size:22px;margin-bottom:3px;">🔍</span>
            <span class="btn-label" style="color:#00f0ff;">Анализ фото / OCR</span>
          </div>
        </div>

        <div class="btn" data-action="feature-video">
          <div class="btn-content">
            <span style="font-size:22px;margin-bottom:3px;">🎥</span>
            <span class="btn-label" style="color:#00f0ff;">Скачать видео (YouTube / TikTok)</span>
          </div>
        </div>

        <div class="btn" data-action="feature-pdf">
          <div class="btn-content">
            <span style="font-size:22px;margin-bottom:3px;">📄</span>
            <span class="btn-label" style="color:#00f0ff;">Конвертер файлов</span>
          </div>
        </div>

        <div class="btn" data-action="feature-summarize">
          <div class="btn-content">
            <span style="font-size:22px;margin-bottom:3px;">📰</span>
            <span class="btn-label" style="color:#00f0ff;">Суммаризация статьи по ссылке</span>
          </div>
        </div>

        <div class="btn" data-action="back">
          <div class="btn-content">
            <span style="font-size:22px;margin-bottom:3px;">←</span>
            <span class="btn-label" style="color:#00f0ff;">Назад</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Все остальные страницы (market, services, payment, partners, socials, donate, smarthome, crypto, diary, qr, translator) остаются без изменений -->

    <!-- ... твой остальной код страниц ... -->

  </div>

<script type="module" src="./app/index.js"></script>
</body>
</html>
