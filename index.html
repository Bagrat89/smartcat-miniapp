<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Smartcat Miniapp</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Orbitron:wght@700;900&family=Exo+2:wght@400;600;700&display=swap" rel="stylesheet"/>
  <style>
    /* твои старые стили остаются */
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: 'Exo 2', sans-serif; height: 100dvh; overflow: hidden; background: #000; color: #fff; }
    .container { height: 100dvh; display: flex; flex-direction: column; padding: 0px 6px 6px 6px; gap: 4px; }

    /* ... твои остальные стили ... */

    /* новые стили для кнопок Особых функций */
    .special-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
      padding: 12px;
    }
    .special-btn {
      background: rgba(0, 240, 255, 0.12);
      border: 1px solid rgba(0, 240, 255, 0.3);
      border-radius: 12px;
      padding: 16px 8px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .special-btn:hover {
      background: rgba(0, 240, 255, 0.25);
      transform: scale(1.03);
    }
    .special-btn .emoji { font-size: 32px; display: block; margin-bottom: 6px; }
    .special-btn .label { font-size: 14px; font-weight: 500; }
  </style>
</head>
<body>
  <div class="container">
    <!-- ... твои старые блоки (баннер, меню и т.д.) ... -->

    <!-- Раздел Особые функции (заменяй только этот блок, если он уже есть) -->
    <div id="features" class="page">
      <div class="title">🛠️ Особые функции</div>
      <div class="special-grid">

        <div class="special-btn" data-action="special-image">
          <span class="emoji">🎨</span>
          <span class="label">Генерация картинки</span>
        </div>

        <div class="special-btn" data-action="special-photo-edit">
          <span class="emoji">✂️📸</span>
          <span class="label">Редактор фото</span>
        </div>

        <div class="special-btn" data-action="special-ocr">
          <span class="emoji">🔍📄</span>
          <span class="label">Анализ фото / OCR</span>
        </div>

        <div class="special-btn" data-action="special-download">
          <span class="emoji">⬇️🎥</span>
          <span class="label">Скачать видео</span>
        </div>

        <div class="special-btn" data-action="special-crypto">
          <span class="emoji">₿💱</span>
          <span class="label">Крипто курс + конвертер</span>
        </div>

        <div class="special-btn" data-action="special-smarthome">
          <span class="emoji">🏠🔌</span>
          <span class="label">Умный дом</span>
        </div>

        <div class="special-btn" data-action="special-reminder">
          <span class="emoji">📅🔔</span>
          <span class="label">Напоминания</span>
        </div>

        <div class="special-btn" data-action="special-qr">
          <span class="emoji">🔲</span>
          <span class="label">QR-код</span>
        </div>

        <div class="special-btn" data-action="special-translate">
          <span class="emoji">🌐</span>
          <span class="label">Переводчик</span>
        </div>

        <div class="special-btn" data-action="special-convert">
          <span class="emoji">📁↔️</span>
          <span class="label">Конвертер файлов</span>
        </div>

        <div class="special-btn" data-action="special-summary">
          <span class="emoji">📝✂️</span>
          <span class="label">Суммаризация статьи</span>
        </div>

        <div class="btn back-btn" data-action="back">
          <span class="emoji">←</span>
          <span class="label">Назад</span>
        </div>
      </div>
    </div>

    <!-- ... остальные твои страницы ... -->
  </div>

  <script>
    // твой старый код ...

    // добавь это в конец обработчика кликов (где btn.addEventListener)
    btn.addEventListener('click', () => {
      const action = btn.dataset.action;

      // ... твои старые действия ...

      if (action.startsWith('special-')) {
        const func = action.replace('special-', '');

        // функции на фронте (пока заглушки)
        if (func === 'qr' || func === 'translate' || func === 'crypto') {
          tg.showAlert(`Открываем ${func}... (в разработке)`);
          // позже здесь будет реальная логика
        } 
        // все остальные — в бот
        else {
          Telegram.WebApp.sendData(JSON.stringify({
            action: 'special_function',
            function: func
          }));
          tg.showAlert(`Открываем ${func} в боте...`);
          tg.close(); // закрываем миниапп → бот сразу ответит
        }
      }

      // ... остальной твой код ...
    });
  </script>
</body>
</html>
